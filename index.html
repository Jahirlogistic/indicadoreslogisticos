EXT[1]={h:`<h2>Unidad 1. Clasificación de los indicadores de gestión a partir de los estados contables</h2>
<p><b>Objetivo:</b> separar los costos logísticos reales de los gastos generales, medirlos con criterios reproducibles y calcular el costo logístico sobre ventas, entendiendo qué significa (y qué no) hablar de utilidad atribuible a la logística.</p>

<h3>1.1 Introducción: por qué la logística necesita a la contabilidad</h3>
<p>La logística consume dinero y, a la vez, protege ingresos: mantiene producto disponible, cumple plazos y evita pérdidas. El problema es que la contabilidad tradicional no muestra «el costo logístico» como una sola cifra. El flete puede estar en costo de ventas o en gastos de distribución; el coordinador de bodega, en nómina administrativa; el arriendo del centro de distribución, en servicios generales. En una distribuidora de Urabá que mueve abarrotes o banano hacia Medellín o Cartagena, el transporte es visible, pero el almacenamiento, los inventarios y las devoluciones suelen quedar dispersos.</p>
<p><b>Principio de la unidad:</b> un indicador logístico es tan confiable como la clasificación de costos que lo alimenta. Si se mezclan gastos ajenos a la operación, la conclusión gerencial será equivocada aunque la fórmula sea correcta.</p>

<h3>1.2 Conceptos fundamentales</h3>
<table class="t"><tr><th>Concepto</th><th>Significado</th><th>Ejemplo</th></tr>
<tr><td>Dato</td><td>Valor registrado de una transacción</td><td>1.200 pedidos despachados</td></tr>
<tr><td>Indicador</td><td>Medida calculada que se compara con una referencia</td><td>96 % de pedidos despachados a tiempo</td></tr>
<tr><td>Meta</td><td>Resultado esperado</td><td>OTD ≥ 98 %</td></tr>
<tr><td>Brecha</td><td>Diferencia entre resultado y meta</td><td>96 % − 98 % = −2 puntos</td></tr>
<tr><td>Costo logístico</td><td>Recursos consumidos en actividades logísticas dentro del alcance definido</td><td>Fletes, bodega, empaque, personal del CD</td></tr>
<tr><td>Gasto general</td><td>Recurso no exclusivo de la operación logística</td><td>Publicidad, honorarios jurídicos corporativos</td></tr>
<tr><td>Desembolso</td><td>Salida efectiva de dinero</td><td>Pago al proveedor de combustible</td></tr>
<tr><td>Inversión</td><td>Recursos para adquirir o mejorar activos</td><td>Compra de un montacargas</td></tr></table>
<p>Un dato aislado describe; un indicador permite evaluar. Decir «gastamos $80 millones en transporte» es un dato; decir que equivalen al 8 % de las ventas es un indicador, y aun así no demuestra eficiencia: hay que mirar tipo de mercancía, distancias, volúmenes y nivel de servicio.</p>
<details class="fq"><summary>Comprueba: ¿la compra de un montacargas de $120 millones es costo logístico de ese mes?</summary>No. Es una inversión en activos. Para el análisis mensual se considera su depreciación, mantenimiento, energía y seguros. Confundir inversión con costo del período dispara el indicador en un solo mes y lleva a decisiones erradas.</details>

<h3>1.3 Los estados financieros vistos desde la logística</h3>
<p>En Colombia, cada entidad aplica el marco técnico normativo de información financiera que le corresponde, compilado en el Decreto 2420 de 2015 y sus modificaciones. El análisis logístico parte de esa información y la complementa con registros internos por proceso.</p>
<table class="t"><tr><th>Estado</th><th>Qué aporta a la logística</th><th>Cuidado</th></tr>
<tr><td>Estado del resultado integral</td><td>Ingresos, costo de ventas, gastos de distribución, personal, arriendos, deterioros de inventario</td><td>Las partidas logísticas vienen agrupadas; hay que abrir notas y auxiliares</td></tr>
<tr><td>Estado de situación financiera</td><td>Inventarios, equipos, vehículos, cuentas por pagar a transportadores, cuentas por cobrar</td><td>El valor de un activo no es costo del período</td></tr>
<tr><td>Estado de flujos de efectivo</td><td>Cómo las decisiones operativas afectan el efectivo (por ejemplo, más inventario inmoviliza capital)</td><td>Costo reconocido, desembolso e inversión no son intercambiables</td></tr></table>
<p><b>Ejemplo:</b> ventas por $1.000 millones; transporte $65 M, salarios del CD $30 M y arriendo de bodega $15 M suman $110 M identificados. No es el costo logístico total: aún pueden faltar costos de inventario, sistemas, seguros, equipos y devoluciones.</p>

<h3>1.4 Costo logístico, gasto general y costo del producto</h3>
<p><b>Costo del producto:</b> parte del costo de adquisición o producción que se reconoce en inventario o en costo de ventas. Algunos fletes de entrada pueden formar parte del costo del inventario; los de entrega al cliente suelen tratarse distinto. De allí la regla de control: <i>un costo puede ser logístico en lo económico sin figurar en una cuenta llamada «costos logísticos»</i>.</p>
<p><b>No clasifique por el nombre de la cuenta.</b> El salario de una persona de recursos humanos es administrativo, pero si dedica parte de su tiempo exclusivamente al personal del CD, una porción puede asignarse a logística con un criterio razonable y verificable (por ejemplo, horas dedicadas).</p>
<details class="fq"><summary>Comprueba: una empresa define que su indicador excluye devoluciones y costo financiero del inventario. ¿Es válido?</summary>Sí, siempre que el alcance quede definido y documentado y se aplique de forma consistente en todos los períodos. Lo inválido es cambiar el alcance sin avisar, porque rompe la comparabilidad.</details>

<h3>1.5 Cuatro formas de clasificar los costos logísticos</h3>
<table class="t"><tr><th>Criterio</th><th>Categorías</th><th>Para qué sirve</th></tr>
<tr><td>Por proceso</td><td>Aprovisionamiento, almacenamiento, inventarios, preparación de pedidos, transporte y distribución, devoluciones, gestión logística</td><td>Saber dónde se consumen los recursos</td></tr>
<tr><td>Por trazabilidad</td><td>Directo (identificable con un pedido, ruta o proceso) / indirecto (requiere un criterio de asignación)</td><td>Decidir si se asigna o se distribuye</td></tr>
<tr><td>Por comportamiento</td><td>Fijo (arriendo con canon fijo), variable (empaque por pedido), mixto (tarifa base + cobro por unidad)</td><td>Presupuestar y estimar el efecto de cambios de volumen</td></tr>
<tr><td>Por controlabilidad</td><td>Controlable / no controlable en el corto plazo</td><td>Asignar responsabilidades realistas</td></tr></table>
<p><b>Dos confusiones frecuentes:</b> un costo indirecto no es necesariamente un gasto general (el arriendo de una bodega compartida es logístico e indirecto); y un costo fijo no es lo mismo que uno no controlable (el canon no se cambia este mes, pero puede renegociarse al vencer el contrato).</p>
<details class="fq"><summary>Comprueba: clasifica el combustible de un camión dedicado a entregas.</summary>Proceso: transporte y distribución. Trazabilidad: directo si se asocia a la ruta o vehículo. Comportamiento: variable (depende de kilómetros). Controlabilidad: parcialmente controlable (rutas, conducción), no así el precio del combustible.</details>

<h3>1.6 Procedimiento para identificar los costos logísticos reales</h3>
<table class="t"><tr><th>Etapa</th><th>Qué hacer</th><th>Orientación práctica</th></tr>
<tr><td>1. Alcance</td><td>Definir qué actividades se consideran logísticas</td><td>Decida si incluye logística inversa, costo financiero del inventario y servicios tercerizados</td></tr>
<tr><td>2. Período</td><td>Mismo período para costos y ventas</td><td>No divida costos de enero a junio entre ventas de enero a marzo</td></tr>
<tr><td>3. Registros</td><td>Revisar auxiliares, comprobantes, facturas y centros de costo</td><td>Si una cuenta mezcla conceptos, abra su detalle</td></tr>
<tr><td>4. Proceso</td><td>Asociar cada transacción al proceso que la originó</td><td>Combustible a distribución; equipos de manipulación a almacenamiento</td></tr>
<tr><td>5. Directos e indirectos</td><td>Asignar los directos; distribuir los indirectos con inductores</td><td>m², horas de equipo, pedidos, movimientos, kilómetros u horas de trabajo según la causa del costo</td></tr>
<tr><td>6. Doble contabilización</td><td>Incluir cada transacción una sola vez</td><td>El flete de entrada ya sumado al costo del inventario no se vuelve a sumar</td></tr>
<tr><td>7. Conciliación</td><td>Contrastar con la contabilidad y explicar diferencias</td><td>Documente estimaciones y su incertidumbre</td></tr>
<tr><td>8. Ficha técnica</td><td>Registrar fórmula, fuente, responsable, frecuencia, unidad y meta</td><td>Permite repetir y auditar el cálculo</td></tr></table>
<p>Repartir todos los indirectos por ventas es cómodo, pero distorsiona cuando los productos consumen recursos logísticos muy distintos (un producto voluminoso y barato ocupa mucha bodega y vende poco).</p>

<h3>1.7 Caso resuelto: Distribuciones del Urabá S. A. S.</h3>
<p>Ventas netas de septiembre: $1.000.000.000. Registros: costo de adquisición de mercancías vendidas $600 M; transporte de distribución $65 M; personal del CD $30 M; arriendo de bodega $15 M; materiales de empaque $8 M; publicidad $12 M; honorarios jurídicos corporativos $5 M; salarios de administración general $20 M.</p>
<p><b>Análisis:</b> son logísticas transporte, personal del CD, bodega y empaque. Se excluyen publicidad, honorarios y administración general porque no se ha demostrado relación con la operación. El costo de adquisición no se suma automáticamente: puede contener fletes de entrada y habría que examinar su composición para no duplicar ni omitir.</p>
<p><span class="f">CL = 65 + 30 + 15 + 8 = $118 M</span></p>
<p><span class="f">CLV (%) = Costos logísticos / Ventas netas × 100 = 118 / 1.000 × 100 = 11,8 %</span></p>
<p><b>Interpretación:</b> por cada $100 vendidos hay $11,80 de costo logístico identificado bajo el alcance definido. No es el costo total definitivo mientras haya partidas por identificar. Para juzgar si es alto hay que compararlo con períodos anteriores, empresas comparables y niveles de servicio equivalentes. Si baja de 11,8 % a 10,5 % podría ser mejora, o podría ser recorte a costa de entregas tardías y devoluciones; por eso se lee junto con tiempo y calidad (Unidades 4, 5 y 7).</p>

<h3>1.8 ¿Qué es la «utilidad atribuible a la logística»?</h3>
<p>No es una partida contable normalizada: es una medida de gestión que debe definirse según el objetivo. Una venta depende del producto, el precio, la publicidad, la gestión comercial y la disponibilidad logística; atribuir a logística todo el margen sería incorrecto.</p>
<ul><li><b>Método 1, resultado por costos:</b> R = Ingresos − Costos − Gastos. Mide el resultado del alcance definido, pero incluye otras funciones; no debe llamarse utilidad logística sin más.</li>
<li><b>Método 2, contribución de una mejora:</b> Bn = ahorro − costo adicional. Un rediseño de rutas ahorra $12 M mensuales y exige $3 M en tecnología y planificación: <span class="f">Bn = 12 − 3 = $9 M</span>, siempre que ahorros y costos sean verificables y del mismo período.</li>
<li><b>Método 3, margen de contribución por pedido, cliente o canal:</b> MC = Ventas asignadas − Costos variables asignados, descontando luego costos logísticos específicos sin duplicar. Revela clientes con muchos despachos, devoluciones o requisitos especiales.</li></ul>
<p>Antes de usar el término hay que declarar qué ingresos y costos se atribuyen, cómo se reparten los recursos compartidos y qué queda fuera. Una cifra sin esa metodología aparenta precisión que no tiene.</p>
<details class="fq"><summary>Comprueba: ¿puede un gerente afirmar «la logística generó $200 M de utilidad» con solo restar costos logísticos de las ventas?</summary>No. Esa diferencia también refleja precio, producto y gestión comercial. Necesita un método de atribución explícito (por ejemplo, ahorros verificables o margen de contribución por cliente) y debe declarar qué excluye.</details>

<h3>1.9 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Causa</th><th>Cómo evitarlo</th></tr>
<tr><td>Todo gasto es logístico</td><td>Clasificar por cercanía percibida</td><td>Asociar cada partida a un proceso definido</td></tr>
<tr><td>Solo el transporte cuenta</td><td>Es el costo más visible</td><td>Usar la clasificación integral por procesos</td></tr>
<tr><td>Sumar una factura dos veces</td><td>Aparece en reportes distintos</td><td>Conciliar fuentes y controlar duplicados</td></tr>
<tr><td>Costos de un período contra ventas de otro</td><td>Cortes distintos entre áreas</td><td>Fijar un período común</td></tr>
<tr><td>Indirectos repartidos por igual o solo por ventas</td><td>Facilidad de cálculo</td><td>Elegir inductores ligados al consumo del recurso</td></tr>
<tr><td>Menor costo siempre es mejor</td><td>Mirar el indicador aislado</td><td>Leerlo junto con tiempo, calidad y seguridad</td></tr></table>

<h3>1.10 Actividad de aplicación</h3>
<p>Una empresa tiene ventas netas de $750 M; transporte $42 M; operación de bodega $18 M; empaque $6 M; publicidad $9 M; gastos jurídicos corporativos $4 M. (1) Clasifique las partidas. (2) Calcule los costos logísticos. (3) Calcule el CLV. (4) Interprételo. (5) Señale dos partidas que requerirían revisión antes de afirmar que es el costo total. (6) Proponga una mejora y el indicador que verifica que no deteriora el servicio.</p>
<details class="fq"><summary>Ver solución orientativa</summary>CL = 42 + 18 + 6 = $66 M. CLV = 66/750 × 100 = 8,8 %: $8,80 de costo logístico identificado por cada $100 vendidos; no se puede decir si es óptimo sin referentes. Por revisar: fletes de entrada incluidos en el costo de adquisición, costo de mantener inventario y tiempo administrativo dedicado parcialmente a logística. Mejora posible: consolidar despachos; verificar con OTD y OTIF.</details>

<h3>1.11 Síntesis: lo que debes dominar antes de avanzar</h3>
<ul><li>Diferenciar costo logístico, gasto general, desembolso e inversión.</li><li>Explicar qué aporta cada estado financiero al análisis logístico.</li><li>Clasificar costos por proceso, trazabilidad, comportamiento y controlabilidad.</li><li>Aplicar el procedimiento de 8 etapas y evitar la doble contabilización.</li><li>Calcular e interpretar el CLV con sus límites.</li><li>Reconocer por qué la utilidad atribuible a la logística exige metodología.</li></ul>

<h3>1.12 Glosario</h3>
<p><b>Alcance:</b> conjunto de actividades y costos incluidos en el indicador. <b>Auxiliar contable:</b> detalle de las transacciones de una cuenta. <b>Inductor de costo:</b> variable que explica por qué se consume un recurso (m², horas, pedidos). <b>Conciliación:</b> contraste entre dos fuentes para explicar diferencias. <b>CLV:</b> costos logísticos sobre ventas.</p>

<h3>Referencias y nota de fuentes</h3>
<p class="ref"><b>Fuentes normativas:</b> Decreto 2420 de 2015 y sus modificaciones (marco técnico de información financiera en Colombia); NIC 1, Presentación de Estados Financieros. <b>Literatura de consulta sugerida para profundizar</b> en costos y gestión logística: Bowersox, Closs y Cooper, <i>Supply Chain Logistics Management</i>; Ballou, <i>Logística: administración de la cadena de suministro</i>. <b>Aclaración:</b> las definiciones de «costo logístico sobre ventas», los pasos de identificación de costos y los tres métodos de atribución son una <b>síntesis pedagógica</b> de este curso, no citas textuales de esas obras. Verifica edición y páginas antes de citarlas en documentos académicos.</p>`,

EXT[2]={h:`<h2>Unidad 2. Matriz logística de los indicadores de gestión</h2>
<p><b>Objetivo:</b> construir el mapa de control que cruza procesos con KPI, metas, responsables y acciones, y usarlo para detectar brechas operativas y hacer benchmarking válido.</p>

<h3>2.1 Introducción: de medir a gestionar</h3>
<p>Una empresa puede calcular decenas de indicadores y aun así administrar mal si no sabe cuáles son prioritarios, quién responde por cada desviación y qué se hace cuando aparece. La <b>matriz logística</b> organiza los KPI (<i>Key Performance Indicators</i>) por proceso y los conecta con objetivos, metas, fuentes, responsables y acciones. Convierte datos dispersos en un sistema de control.</p>
<p><b>Ejemplo:</b> una distribuidora registra 2.000 pedidos entregados, 1.840 a tiempo y 1.900 completos. Esos datos sirven, pero solo se vuelven gestión cuando la matriz dice que el responsable de distribución debe llevar el cumplimiento a 98 %, que se revisa cada semana y qué se investiga si falla.</p>

<h3>2.2 Lista, ficha técnica y matriz de control</h3>
<table class="t"><tr><th>Herramienta</th><th>Función</th><th>Contenido</th></tr>
<tr><td>Lista de indicadores</td><td>Identificar qué se medirá</td><td>Nombre, proceso, objetivo</td></tr>
<tr><td>Ficha técnica</td><td>Definir cómo se calcula, para que todos lo hagan igual</td><td>Fórmula, variables, unidad, fuente, periodicidad, reglas de interpretación</td></tr>
<tr><td>Matriz de control</td><td>Usar los resultados para dirigir la operación</td><td>Metas, resultado, brecha, responsable, acción correctiva</td></tr></table>
<details class="fq"><summary>Comprueba: dos analistas calculan el «OTD» y obtienen cifras distintas con los mismos datos. ¿Qué herramienta falló?</summary>La ficha técnica: no fijó con precisión numerador, denominador, evento de entrega y reglas de inclusión. La matriz depende de que la ficha elimine esa ambigüedad.</details>

<h3>2.3 Estrategia, procesos e indicadores</h3>
<p>La cadena lógica es: objetivo estratégico → objetivo logístico → proceso responsable → indicador → meta y resultado real → ¿se cumple? Si sí, se mantiene y verifica; si no, se analiza la causa, se define la acción correctiva y se mide de nuevo.</p>
<p><b>Ejemplo:</b> estratégico, retener clientes; logístico, entregar completo y en plazo; proceso, preparación y distribución; indicador, OTIF; meta ilustrativa, ≥ 97 %; reacción, investigar faltantes, retrasos, errores de preparación y fallas de transporte. Esta cadena evita elegir indicadores solo porque son fáciles de calcular.</p>

<h3>2.4 Clasificación de los indicadores en la matriz</h3>
<table class="t"><tr><th>Tipo</th><th>Mide</th><th>Ejemplos</th></tr>
<tr><td>Financieros</td><td>Consumo de recursos económicos</td><td>Costo logístico sobre ventas, costo por pedido, costo por tonelada</td></tr>
<tr><td>Tiempo</td><td>Duración y cumplimiento de plazos</td><td>Lead Time, tiempo de recepción, OTD</td></tr>
<tr><td>Calidad</td><td>Conformidad con requisitos</td><td>Exactitud del inventario, pedidos sin errores, tasa de daños</td></tr>
<tr><td>Productividad</td><td>Resultados frente a recursos</td><td>Pedidos por hora-hombre, movimientos por hora de equipo</td></tr>
<tr><td>Integrales de servicio</td><td>Lo que recibe el cliente</td><td>OTD, OTIF, Pedido Perfecto</td></tr></table>
<p>Un mismo proceso necesita indicadores de varias categorías: reducir el costo de distribución no basta si se entrega tarde o incompleto.</p>

<h3>2.5 Estructura de la matriz</h3>
<table class="t"><tr><th>Campo</th><th>Qué debe especificar</th><th>Orientación práctica</th></tr>
<tr><td>Proceso y objetivo</td><td>Actividad evaluada y resultado buscado</td><td>Un objetivo por indicador prioritario</td></tr>
<tr><td>Indicador, definición, fórmula, unidad</td><td>Qué mide, qué incluye y cómo se calcula</td><td>Enlace a la ficha técnica</td></tr>
<tr><td>Meta, resultado, brecha</td><td>Esperado, observado y diferencia</td><td>Indique si mayor o menor es mejor</td></tr>
<tr><td>Frecuencia y fuente</td><td>Cada cuánto y de qué sistema</td><td>Solo fuentes que pueda verificar</td></tr>
<tr><td>Responsable y acción</td><td>Quién gestiona y qué se hace ante una desviación</td><td>Quien responde debe tener autoridad sobre el resultado</td></tr></table>
<p>Es preferible empezar con pocos indicadores confiables que con una tabla extensa que nadie puede verificar.</p>

<h3>2.6 Procedimiento de construcción</h3>
<ol><li><b>Procesos:</b> abastecimiento, almacenamiento, inventarios, preparación, transporte, distribución y devoluciones.</li><li><b>Objetivos</b> por proceso (por ejemplo, almacenamiento: preservar mercancía, exactitud, uso del espacio).</li><li><b>Indicadores</b> que midan directamente el resultado a controlar; descartar los que no conduzcan a decisiones.</li><li><b>Fichas técnicas</b> con numerador, denominador, período, unidad y reglas de inclusión.</li><li><b>Metas</b> según capacidad, necesidades del cliente, histórico, restricciones y referentes.</li><li><b>Responsabilidades:</b> distinguir quien produce el dato, quien lo valida, quien analiza causas y quien puede implementar mejoras.</li><li><b>Frecuencia:</b> el sistema puede registrar a diario, informar cada semana y revisar tendencias cada mes.</li><li><b>Mecanismo de reacción:</b> revisión inmediata, análisis de causas, reunión de seguimiento o plan de mejora.</li><li><b>Validación</b> de fórmulas, fuentes, metas y responsables antes de evaluar con ella.</li></ol>

<h3>2.7 Caso resuelto: matriz de Distribuciones del Urabá</h3>
<table class="t"><tr><th>Proceso</th><th>Indicador</th><th>Meta ilustrativa</th><th>Real</th><th>Lectura</th></tr>
<tr><td>Transporte</td><td>OTD</td><td>≥ 98 %</td><td>94 %</td><td>Incumple</td></tr>
<tr><td>Inventarios</td><td>Exactitud</td><td>≥ 99 %</td><td>96,5 %</td><td>Diferencias por investigar</td></tr>
<tr><td>Preparación</td><td>Pedidos sin errores</td><td>≥ 99 %</td><td>97 %</td><td>Errores de alistamiento o verificación</td></tr>
<tr><td>Distribución</td><td>CLV</td><td>≤ 10 %</td><td>11,2 %</td><td>Supera el límite</td></tr></table>
<p>La matriz señala <i>dónde</i> hay desviación, no <i>por qué</i>. El OTD bajo puede deberse a retrasos de alistamiento, falta de vehículos, congestión, direcciones erradas o promesas comerciales poco realistas; hay que investigar antes de actuar.</p>
<p><b>Brecha absoluta:</b> <span class="f">B = 94 % − 98 % = −4 puntos porcentuales</span>. <b>Brecha relativa:</b> <span class="f">D = (98 − 94) / 98 × 100 ≈ 4,08 %</span>. Son medidas distintas: la primera es distancia en puntos; la segunda, esa distancia como proporción de la meta. Declara cuál usas.</p>

<h3>2.8 Semaforización</h3>
<p>Verde: se alcanza o supera la meta. Amarillo: desviación moderada que pide seguimiento. Rojo: desviación sobre la tolerancia, que exige intervención. En indicadores donde menor es mejor (costo por pedido) la lógica se invierte. Los umbrales se definen por indicador: no sirve la misma regla para OTD, costo y tasa de daños. Un indicador en verde con tendencia negativa justifica actuar de forma preventiva.</p>

<h3>2.9 Benchmarking y análisis de brechas</h3>
<p><b>Benchmarking:</b> comparación sistemática para identificar diferencias de desempeño, entender las prácticas que las explican y adaptarlas. Modalidades: <i>interno</i> (entre CD, períodos o rutas de la misma empresa), <i>competitivo</i> (con competidores, si la información es legítima y comparable) y <i>funcional</i> (con organizaciones de otros sectores que hacen procesos similares). Solo es válido si coinciden definiciones, período, unidad, tipo de operación y nivel de servicio: comparar 500 pedidos urbanos pequeños con cargas consolidadas de varias toneladas genera conclusiones engañosas.</p>
<p><b>Análisis de brechas:</b> confirmar comparabilidad → cuantificar → ubicar el proceso donde se origina → investigar causas → priorizar por impacto → medir de nuevo.</p>
<details class="fq"><summary>Comprueba: el CD de Apartadó tiene costo por pedido de $14.000 y el de otra ciudad $11.000. ¿Hay una brecha de $3.000?</summary>No necesariamente. Primero verifica que midan lo mismo (alcance de costos, tipo de pedido, distancia, nivel de servicio). Si no son comparables, la «brecha» es un artefacto de la medición.</details>

<h3>2.10 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Consecuencia</th><th>Prevención</th></tr>
<tr><td>KPI sin objetivo</td><td>Informes que no orientan decisiones</td><td>Vincular cada KPI con un objetivo explícito</td></tr>
<tr><td>Cambiar fórmulas sin registro</td><td>Se pierde la comparabilidad histórica</td><td>Controlar versiones de las fichas</td></tr>
<tr><td>Comparar operaciones distintas</td><td>Brechas artificiales</td><td>Homologar definiciones y condiciones</td></tr>
<tr><td>Responsable sin autoridad</td><td>Desviaciones sin corrección</td><td>Separar responsabilidad operativa y factores externos</td></tr>
<tr><td>Solo indicadores de costo</td><td>Deterioro del servicio</td><td>Combinar costo, tiempo, calidad y productividad</td></tr>
<tr><td>Misma semaforización para todo</td><td>Lecturas erradas</td><td>Umbrales por indicador</td></tr></table>

<h3>2.11 Actividad de aplicación</h3>
<p>Datos: exactitud 97 % (meta 99 %); OTD 96 % (meta 98 %); costo por pedido $18.000 (límite $16.000); productividad 24 pedidos/HH (meta 28). (1) Organícelos en una matriz. (2) Calcule las brechas. (3) Clasifique cada indicador. (4) Proponga responsable y fuente. (5) Plantee una hipótesis de causa por desviación. (6) Formule una mejora y el indicador que verifica sus efectos.</p>
<details class="fq"><summary>Ver solución orientativa</summary>Brechas: exactitud −2 puntos; OTD −2 puntos; costo +$2.000 sobre el límite; productividad −4 pedidos/HH. Tipos: calidad, tiempo, financiero, productividad. Una productividad baja puede venir de recorridos excesivos, ubicaciones inadecuadas, faltantes o pedidos más complejos: son hipótesis hasta comprobarlas con datos.</details>

<h3>2.12 Síntesis y glosario</h3>
<p>Debes poder construir una matriz que relacione procesos, objetivos, fórmulas, metas, fuentes, responsables y acciones; interpretar brechas; diseñar reglas de seguimiento; y explicar por qué una comparación solo es válida con mediciones consistentes.</p>
<p><b>KPI:</b> indicador clave de desempeño. <b>Brecha:</b> diferencia entre resultado y meta o referente. <b>Semaforización:</b> código de colores por umbrales. <b>Benchmarking:</b> comparación sistemática con referentes. <b>Línea base:</b> valor inicial contra el cual se mide la mejora.</p>
<p class="ref"><b>Lectura sugerida:</b> Kaplan y Norton, «The Balanced Scorecard: Measures That Drive Performance», <i>Harvard Business Review</i> (1992), sobre medición ligada a estrategia; el modelo SCOR de la ASCM (antes APICS) como referente de métricas por proceso. <b>Aclaración:</b> la estructura de campos, el procedimiento de 9 etapas, la distinción entre brecha absoluta y relativa y los esquemas de semaforización son una <b>síntesis pedagógica</b> del curso, no citas literales. Verifica las fuentes antes de citarlas.</p>`,

EXT[3]={h:`<h2>Unidad 3. Indicadores financieros y operativos</h2>
<p><b>Objetivo:</b> traducir la operación a dinero (costo sobre ventas, costo por pedido, por tonelada, ventas perdidas) y medir el uso diario de los recursos, interpretando ambos juntos.</p>

<h3>3.1 Introducción</h3>
<p>Los indicadores <b>financieros</b> muestran cuánto cuesta operar y qué impacto económico tiene; los <b>operativos</b> muestran cómo se ejecutan los procesos, qué recursos se usan y qué volúmenes se procesan. Separarlos produce decisiones peligrosas: una empresa puede recortar vehículos para bajar costos, pero si eso causa retrasos, ventas perdidas y clientes insatisfechos, el ahorro inicial termina siendo una pérdida.</p>

<h3>3.2 Conceptos financieros base</h3>
<table class="t"><tr><th>Concepto</th><th>Significado</th></tr>
<tr><td>Ingreso</td><td>Valor reconocido por la venta de bienes o servicios según las reglas contables</td></tr>
<tr><td>Costo</td><td>Recursos consumidos para adquirir, producir o prestar un servicio</td></tr>
<tr><td>Gasto</td><td>Consumo reconocido en el resultado del período que no es costo de un activo ni de lo vendido</td></tr>
<tr><td>Margen</td><td>Diferencia o proporción entre ingresos y ciertos costos, según la definición usada</td></tr>
<tr><td>Rentabilidad</td><td>Relación entre un resultado económico y una base (ventas, activos, capital)</td></tr></table>
<p>El costo por pedido mide consumo promedio por pedido; <b>no</b> dice cuánto gana la empresa.</p>

<h3>3.3 Costos logísticos sobre ventas (CLV)</h3>
<p><span class="f">CLV (%) = Costos logísticos del período / Ventas netas del período × 100</span></p>
<p><b>Variables:</b> costos logísticos dentro del alcance definido (Unidad 1) y ventas netas calculadas con criterio consistente. Un CLV de 9 % significa $9 de costo logístico por cada $100 de ventas netas. Puede bajar porque mejoró la eficiencia o simplemente porque subieron las ventas con costos iguales; por eso se lee con costos totales, volumen despachado, nivel de servicio y complejidad.</p>

<h3>3.4 Costo logístico por pedido</h3>
<p><span class="f">Costo por pedido = Costos logísticos del período / Número de pedidos incluidos</span></p>
<p>Con $90 M y 6.000 pedidos: <b>$15.000 por pedido</b>. Es un promedio útil para presupuestar y comparar períodos, pero un pedido de una unidad no consume lo mismo que uno de 40 líneas con entrega rural. Para afinar, calcule por tipo de pedido, cliente, canal, ruta o centro de distribución. Defina qué etapa cuenta como «pedido» en el denominador (recibido, preparado, despachado o entregado).</p>

<h3>3.5 Costo de transporte por unidad movilizada</h3>
<p><span class="f">Costo por tonelada = Costo de transporte / Toneladas transportadas</span></p>
<p>$48 M por 240 t = <b>$200.000 por tonelada</b>. Para comparar rutas, considere distancia, peajes, tipo de vehículo, características de la carga, restricciones de acceso y nivel de servicio. Cuando volumen, peso y distancia varían mucho, es más justo usar costo por tonelada-kilómetro o indicadores por ruta. Un trayecto de banano de Urabá a puerto y uno de carga mixta a Medellín no se comparan con un solo promedio.</p>
<details class="fq"><summary>Comprueba: la ruta A cuesta $150.000/t y la B $230.000/t. ¿La B es ineficiente?</summary>No se sabe. Puede tener más distancia, peajes, carga difícil o un nivel de servicio mayor. Antes de juzgar hay que segmentar por ruta y normalizar por distancia.</details>

<h3>3.6 Indicadores operativos de recursos</h3>
<ul><li><b>Pedidos procesados:</b> defina si cuenta recibidos, aceptados, preparados, despachados o entregados; no son equivalentes.</li><li><b>Volumen movilizado:</b> toneladas, unidades, m³, pallets o movimientos, según la operación.</li><li><b>Utilización:</b> <span class="f">Utilización (%) = Capacidad utilizada / Capacidad disponible × 100</span>, con ambas magnitudes en la misma unidad. Si 820 de 1.000 posiciones están ocupadas, la utilización es <b>82 %</b>.</li></ul>
<p>Una utilización alta no implica buena gestión: si la bodega se llena al punto de dificultar recepción y alistamiento, pierde flexibilidad. Distinga capacidad física nominal, capacidad operativa utilizable y capacidad que conviene mantener libre para absorber variaciones de demanda.</p>

<h3>3.7 Ventas perdidas por falta de disponibilidad</h3>
<p>Las ventas perdidas son oportunidades no concretadas por una causa identificada. La falta de inventario es una causa posible, pero no toda venta no realizada es atribuible a logística. Se requiere una metodología que identifique solicitudes no atendidas, estime su valor y evite contar dos veces la misma oportunidad.</p>
<p><span class="f">Demanda no atendida por falta de stock (%) = Valor estimado de demanda no atendida por falta de stock / Valor de demanda potencial definida × 100</span></p>
<p>Con $20 M no atendidos sobre $500 M de demanda potencial: <b>4 %</b>. Esto <b>no</b> significa $20 M de utilidad perdida: hay que descontar costos variables que se habrían incurrido, la posibilidad de recuperar la venta después y la incertidumbre de la estimación. La demanda potencial debe ser explícita y verificable (solicitudes registradas, pedidos rechazados o un modelo documentado).</p>

<h3>3.8 Costo de mantener inventario</h3>
<p>Mantener inventario genera almacenamiento, seguros, deterioro, obsolescencia, manipulación y costo de oportunidad del capital. Aproximación gerencial:</p>
<p><span class="f">Costo anual de mantenimiento = Inventario promedio × Tasa anual de mantenimiento</span></p>
<p>Con inventario promedio de $300 M y tasa de 18 %: <b>$54 M al año</b>. La tasa debe construirse con componentes definidos y sin duplicar costos ya incluidos en otras cuentas, y el inventario se valora con una base consistente (costo contable promedio), no mezclando costo de adquisición con precio de venta.</p>

<h3>3.9 Caso resuelto: evaluación conjunta</h3>
<p>Distribuciones del Urabá en el mes: ventas netas $900 M; costos logísticos identificados $99 M; 5.500 pedidos; transporte $45 M por 225 t; demanda no atendida $18 M sobre $450 M.</p>
<table class="t"><tr><th>Indicador</th><th>Cálculo</th><th>Resultado</th></tr>
<tr><td>CLV</td><td>99 / 900 × 100</td><td>11 %</td></tr>
<tr><td>Costo por pedido</td><td>99.000.000 / 5.500</td><td>$18.000</td></tr>
<tr><td>Costo por tonelada</td><td>45.000.000 / 225</td><td>$200.000</td></tr>
<tr><td>Demanda no atendida</td><td>18 / 450 × 100</td><td>4 %</td></tr></table>
<p><b>Interpretación conjunta:</b> $18.000 por pedido puede ser razonable o excesivo según la complejidad de los pedidos; $200.000/t varía con ruta y distancia; un 4 % de demanda no atendida es una oportunidad importante, pero hay que validar los registros y las causas. La dirección debe preguntarse si una mejor planificación de inventarios reduce las ventas perdidas sin disparar el costo de almacenamiento.</p>

<h3>3.10 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Consecuencia</th><th>Prevención</th></tr>
<tr><td>Comparar costos absolutos sin volumen</td><td>Se confunde crecimiento con ineficiencia</td><td>Usar indicadores unitarios y proporciones</td></tr>
<tr><td>Toda venta no realizada = venta perdida por logística</td><td>Se atribuyen causas comerciales o externas</td><td>Registrar el motivo de la demanda no atendida</td></tr>
<tr><td>Costos entre pedidos recibidos cuando se quiere costo por pedido entregado</td><td>Denominadores distintos</td><td>Definir la etapa del proceso en el denominador</td></tr>
<tr><td>Utilización máxima como meta universal</td><td>Congestión y pérdida de flexibilidad</td><td>Evaluar capacidad, demanda y servicio</td></tr>
<tr><td>Costo por tonelada sin revisar rutas</td><td>Comparaciones poco representativas</td><td>Segmentar por distancia, carga y condiciones</td></tr></table>

<h3>3.11 Actividad de aplicación</h3>
<p>Ventas netas $640 M; costos logísticos $70,4 M; 4.400 pedidos; transporte $32 M para 160 t. Calcule CLV, costo por pedido y costo por tonelada; proponga una decisión de mejora y dos indicadores adicionales para evaluar sus efectos.</p>
<details class="fq"><summary>Ver solución orientativa</summary>CLV = 70,4/640 × 100 = 11 %. Costo por pedido = 70.400.000/4.400 = $16.000. Costo por tonelada = 32.000.000/160 = $200.000. Mejora posible: consolidar despachos cuando el servicio lo permita; controlar a la vez costo de transporte y cumplimiento de plazos (OTD) para evitar que la consolidación genere retrasos.</details>

<h3>3.12 Síntesis y glosario</h3>
<p>Debes poder calcular e interpretar indicadores financieros y operativos, diferenciar costos absolutos y unitarios, estimar el impacto de la falta de disponibilidad y explicar por qué los resultados se leen en conjunto. Dominar la unidad es pasar del cálculo aritmético a la interpretación económica y a la decisión fundamentada.</p>
<p><b>Demanda potencial:</b> demanda que la empresa define y puede verificar. <b>Capacidad operativa:</b> capacidad realmente utilizable. <b>Inventario promedio:</b> valor medio del inventario en el período. <b>Tonelada-kilómetro:</b> una tonelada movida un kilómetro.</p>
<p class="ref"><b>Lectura sugerida:</b> Ballou, <i>Logística: administración de la cadena de suministro</i> (costos de mantener inventario y costos de transporte); Bowersox, Closs y Cooper, <i>Supply Chain Logistics Management</i>. <b>Aclaración:</b> las fórmulas de costo por pedido, costo por tonelada, demanda no atendida y la tasa de mantenimiento son <b>herramientas gerenciales y síntesis pedagógica</b> del curso, no citas de esas obras ni partidas contables normalizadas. Verifica fuentes antes de citarlas.</p>`,

EXT[4]={h:`<h2>Unidad 4. Indicadores de tiempo: Lead Time y cumplimiento de entregas</h2>
<p><b>Objetivo:</b> medir la velocidad del flujo logístico con el Lead Time (ciclo del pedido) y el OTD (On-Time Delivery), identificando dónde se consume el tiempo y por qué.</p>

<h3>4.1 Introducción: por qué el tiempo es crítico</h3>
<p>El tiempo entre el inicio y el fin de una actividad condiciona la disponibilidad del producto, el inventario necesario, el uso de recursos y la capacidad de cumplir compromisos. Una empresa puede tener inventario y vehículos adecuados y aun así servir mal si los pedidos esperan demasiado para procesarse, si el despacho se programa tarde o si la entrega no llega en el plazo acordado. Los indicadores de tiempo responden: ¿cuánto tarda un pedido de punta a punta?, ¿en qué etapa se concentra la demora?, ¿qué proporción cumple la fecha prometida?, ¿qué parte del ciclo es trabajo efectivo y qué parte es espera?</p>

<h3>4.2 Concepto de Lead Time</h3>
<p>El <b>Lead Time</b> es el tiempo transcurrido entre dos eventos definidos de un proceso. No existe un único Lead Time: depende del punto inicial y final que la empresa establezca y documente.</p>
<table class="t"><tr><th>Tipo</th><th>Inicio</th><th>Fin</th></tr>
<tr><td>Aprovisionamiento</td><td>Emisión o confirmación del pedido al proveedor (según definición)</td><td>Recepción de la mercancía</td></tr>
<tr><td>Recepción</td><td>Llegada del vehículo o inicio formal de recepción</td><td>Mercancía recibida y registrada</td></tr>
<tr><td>Preparación</td><td>Liberación del pedido</td><td>Pedido preparado y verificado</td></tr>
<tr><td>Transporte</td><td>Salida del vehículo</td><td>Llegada al destino acordado</td></tr>
<tr><td>Pedido al cliente</td><td>Recepción válida del pedido</td><td>Entrega final según el evento definido</td></tr></table>
<p>Si una empresa mide desde que el pedido ingresa al sistema y otra desde que ya está autorizado para despacho, sus resultados no son comparables.</p>

<h3>4.3 Lead Time total del pedido</h3>
<p><span class="f">LT = Tr + Tp + Td + Tt + Te</span>, con Tr = revisión y liberación, Tp = preparación, Td = espera y procesamiento del despacho, Tt = transporte, Te = entrega y confirmación. La suma es válida solo si los intervalos son consecutivos, sin superposiciones ni huecos. Si hay actividades en paralelo, el tiempo total es el intervalo real entre el evento inicial y el final, no la suma de todas las duraciones.</p>
<p><b>Ejemplo:</b> 2 h revisión + 3 h preparación + 4 h espera de despacho + 5 h transporte + 1 h entrega = <b>15 horas</b>. Cuatro horas se pierden esperando despacho: esa etapa merece investigarse antes de comprar vehículos más rápidos.</p>

<h3>4.4 Tiempo de procesamiento frente a tiempo de espera</h3>
<p><b>Procesamiento:</b> período en que se ejecuta una actividad que prepara, verifica o desplaza mercancía o información. <b>Espera:</b> período en que el pedido está detenido a la espera de autorización, recurso, programación, disponibilidad o fin de otra actividad. Un proceso puede tener pocas horas de trabajo efectivo y un Lead Time largo porque pasa la mayor parte detenido. Esto abre mejoras que no exigen que la gente trabaje más rápido: eliminar autorizaciones innecesarias, secuenciar mejor el alistamiento, asegurar disponibilidad o coordinar horarios de despacho.</p>
<details class="fq"><summary>Comprueba: un pedido tiene 18 h de Lead Time y solo 7 h son trabajo efectivo. ¿Dónde buscar la mejora?</summary>En las 11 h de espera: autorizaciones, colas, programación de despachos o falta de producto. Acelerar el trabajo efectivo atacaría una parte menor del problema.</details>

<h3>4.5 Lead Time promedio, mediana y percentiles</h3>
<p><span class="f">LT promedio = Σ LTi / n</span>. Con 12, 14, 15, 17 y 22 horas: (12+14+15+17+22)/5 = <b>16 h</b>. El promedio oculta la distribución: un pedido de 22 h convive con otros mucho más rápidos. Por eso se complementa con la <b>mediana</b> (valor central; aquí 15 h) y los <b>percentiles</b> (el percentil 90 indica el tiempo dentro del cual se completó el 90 % de los pedidos) y con la proporción de pedidos que superan el tiempo objetivo.</p>

<h3>4.6 OTD: On-Time Delivery</h3>
<p>Mide el porcentaje de entregas dentro del plazo comprometido. Antes de calcular, defina: qué evento cuenta como entrega, cuál es la fecha y hora prometida, qué evidencia confirma la entrega, cómo se tratan cambios de fecha autorizados y entregas parciales, y qué pedidos entran o salen del denominador.</p>
<p><span class="f">OTD (%) = Entregas realizadas a tiempo / Total de entregas evaluables × 100</span></p>
<p>Con 465 de 500 entregas a tiempo: <b>93 %</b>; 35 entregas incumplieron. Causas por investigar: retrasos de preparación, fallas de programación, indisponibilidad de vehículos, restricciones de acceso, direcciones erradas o condiciones externas de transporte (en Urabá, lluvias y estado de las vías son factores reales que deben registrarse como causa, no ocultarse).</p>

<h3>4.7 Fecha prometida, programada y real</h3>
<table class="t"><tr><th>Fecha</th><th>Qué es</th><th>Uso</th></tr>
<tr><td>Prometida</td><td>Compromiso comunicado y aceptado por el cliente</td><td>Referencia del OTD</td></tr>
<tr><td>Programada</td><td>Fecha prevista en la planificación interna</td><td>Control interno</td></tr>
<tr><td>Real</td><td>Momento en que ocurre el evento de entrega</td><td>Se compara contra la prometida</td></tr></table>
<p>Si la empresa prometió el jueves pero programó el viernes y usa la programación como referencia, oculta el incumplimiento. Los cambios de fecha solo son válidos si el cliente los solicita y la empresa los acepta formalmente; no se modifican fechas retrospectivamente para mejorar el indicador.</p>

<h3>4.8 Cumplimiento del tiempo de ciclo</h3>
<p><span class="f">Cumplimiento del LT (%) = Pedidos completados dentro del tiempo objetivo / Total de pedidos evaluables × 100</span></p>
<p>Objetivo de 24 h máximo: de 800 pedidos, 720 cumplen: <b>90 %</b>. No equivale al OTD: este compara la duración con un límite de ciclo; el OTD compara la entrega con el compromiso temporal aplicable.</p>

<h3>4.9 Caso resuelto: reducción del Lead Time</h3>
<p>Ciclo típico de Distribuciones del Urabá: validación 1 h; preparación 4 h; espera de consolidación 5 h; transporte 6 h; entrega 2 h = <b>18 h</b>. Con despachos programados con más frecuencia, la espera baja a 2 h:</p>
<p><span class="f">LT = 1 + 4 + 2 + 6 + 2 = 15 h</span> · reducción = 3 h · <span class="f">(18 − 15)/18 × 100 = 16,67 %</span></p>
<p>Antes de generalizar hay que verificar si la nueva programación sube el costo de transporte, baja la ocupación de los vehículos o afecta la capacidad de alistamiento, y confirmarlo con varios períodos, no con un caso representativo.</p>

<h3>4.10 Cuellos de botella</h3>
<p>Un <b>cuello de botella</b> es la etapa que restringe el flujo total. Se identifica comparando tiempos por etapa, midiendo colas de pedidos pendientes, revisando la utilización de recursos, analizando pedidos detenidos y contrastando capacidad requerida con disponible. La etapa más larga no siempre es el cuello de botella: debe además limitar el flujo, acumular trabajo pendiente y tener capacidad insuficiente frente a la demanda.</p>

<h3>4.11 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Consecuencia</th><th>Prevención</th></tr>
<tr><td>Medir el Lead Time desde eventos distintos</td><td>Resultados no comparables</td><td>Definir con precisión inicio y fin</td></tr>
<tr><td>Usar solo promedios</td><td>Se ocultan pedidos muy demorados</td><td>Analizar mediana y percentiles</td></tr>
<tr><td>Modificar fechas prometidas a posteriori</td><td>Se ocultan incumplimientos</td><td>Controlar cambios y autorizaciones</td></tr>
<tr><td>Confundir OTD con OTIF</td><td>Se ignora la completitud</td><td>Medir tiempo y completitud por separado</td></tr>
<tr><td>Acelerar el trabajo sin rediseñar el proceso</td><td>Más errores e incidentes</td><td>Eliminar esperas y mejorar el diseño</td></tr>
<tr><td>Excluir pedidos tardíos sin regla</td><td>Indicador inflado</td><td>Documentar inclusión y exclusión</td></tr></table>

<h3>4.12 Actividad de aplicación</h3>
<p>Seis pedidos con ciclos de 12, 16, 14, 20, 18 y 28 horas; objetivo: 90 % en máximo 20 h. Calcule el promedio, la mediana, cuántos cumplen, el porcentaje de cumplimiento; proponga cómo investigar las demoras y explique por qué el promedio no basta.</p>
<details class="fq"><summary>Ver solución orientativa</summary>Suma = 108 h; promedio = 18 h. Ordenados: 12, 14, 16, 18, 20, 28; mediana = (16+18)/2 = 17 h. Cumplen 5 de 6: 83,33 %, por debajo del 90 %. Investigue el pedido de 28 h por etapa y busque patrones similares. El promedio de 18 h parece cumplir el límite y esconde que un pedido lo supera por 8 horas.</details>

<h3>4.13 Síntesis y glosario</h3>
<p>Debes poder definir los límites temporales de un proceso, calcular el Lead Time, distinguir procesamiento de espera, interpretar distribuciones, calcular el OTD, identificar cuellos de botella y proponer mejoras sin deteriorar calidad ni seguridad.</p>
<p><b>Lead Time:</b> tiempo entre dos eventos definidos. <b>OTD:</b> porcentaje de entregas a tiempo. <b>Percentil 90:</b> valor bajo el cual está el 90 % de las observaciones. <b>Cuello de botella:</b> etapa que limita el flujo. <b>Fecha prometida:</b> compromiso aceptado con el cliente.</p>
<p class="ref"><b>Lectura sugerida:</b> Chopra y Meindl, <i>Administración de la cadena de suministro</i>; modelo SCOR (ASCM) para métricas de confiabilidad y capacidad de respuesta. <b>Aclaración:</b> las definiciones de Lead Time por tipo, la descomposición LT = Tr + Tp + Td + Tt + Te y las reglas sobre fechas son una <b>síntesis pedagógica</b> del curso; en la práctica cada empresa define sus eventos de inicio y fin. Verifica fuentes antes de citarlas.</p>`,
q:[
["Un pedido tarda 2 h en validación, 4 en preparación, 3 en espera de despacho y 5 en transporte (consecutivas). ¿Lead Time total?",["14 horas","9 horas","12 horas","15 horas"],0,"2+4+3+5 = 14 h."],

EXT[5]={h:`<h2>Unidad 5. Indicadores de calidad logística</h2>
<p><b>Objetivo:</b> evaluar la perfección de la ejecución: exactitud del inventario, errores de preparación, daños, devoluciones y las variables que componen un Pedido Perfecto.</p>

<h3>5.1 Introducción: qué es calidad en logística</h3>
<p>Es el grado en que procesos y resultados cumplen los requisitos definidos para recibir, conservar, preparar, transportar y entregar mercancías. No se limita a evitar daños físicos: incluye preservar la identidad del producto, mantener registros confiables, respetar cantidades, usar documentación correcta y cumplir las condiciones de entrega. Un pedido puede llegar a tiempo y ser un mal servicio si trae referencias equivocadas, unidades faltantes o producto dañado.</p>
<table class="t"><tr><th>Concepto</th><th>Definición</th></tr>
<tr><td>Calidad</td><td>Grado en que las características de un producto, servicio o proceso satisfacen requisitos establecidos</td></tr>
<tr><td>Conformidad</td><td>Cumplimiento de un requisito específico</td></tr>
<tr><td>Satisfacción del cliente</td><td>Percepción del cliente sobre sus expectativas y necesidades</td></tr></table>
<p>No son idénticos: se puede cumplir la especificación y recibir una mala evaluación por algo no medido, como la comunicación sobre el estado del pedido o la facilidad de reclamar.</p>

<h3>5.2 Exactitud del inventario</h3>
<p>Evalúa la concordancia entre cantidades registradas en el sistema y cantidades físicas verificadas. Las diferencias pueden venir de errores de recepción, movimientos no registrados, despachos con cantidades incorrectas, errores de ubicación o identificación, unidades de medida inconsistentes, daños, pérdidas, errores de conteo o transacciones registradas en fecha distinta de la operación física. No se atribuye automáticamente a robo: primero se investiga la causa.</p>
<table class="t"><tr><th>Método</th><th>Fórmula</th><th>Qué responde</th></tr>
<tr><td>Por referencias</td><td>Referencias sin diferencias / Referencias verificadas × 100</td><td>¿Qué proporción de referencias coincide exactamente?</td></tr>
<tr><td>Por unidades</td><td>(1 − Σ|físico − sistema| / Σ físico) × 100</td><td>¿Qué tan cerca está lo registrado de lo físico en cantidades?</td></tr></table>
<p>Con 200 referencias verificadas y 190 coincidentes: <b>95 %</b> por referencias. Este método cuenta igual una diferencia de una unidad y una de cien. El segundo exige denominador positivo, unidades comparables y reglas para sobrantes, faltantes y referencias sin existencia física. No se mezclan ambos resultados: responden preguntas distintas.</p>
<details class="fq"><summary>Comprueba: una bodega reporta «98 % de exactitud» sin decir el método. ¿Qué falta?</summary>Falta saber si es por referencias, unidades o valor. Sin eso la cifra no es comparable con otros períodos ni con otras bodegas.</details>

<h3>5.3 Caso resuelto: conteo de cinco referencias</h3>
<table class="t"><tr><th>Ref.</th><th>Sistema</th><th>Físico</th><th>Dif. absoluta</th></tr>
<tr><td>A</td><td>100</td><td>100</td><td>0</td></tr><tr><td>B</td><td>80</td><td>78</td><td>2</td></tr><tr><td>C</td><td>60</td><td>60</td><td>0</td></tr><tr><td>D</td><td>40</td><td>35</td><td>5</td></tr><tr><td>E</td><td>20</td><td>20</td><td>0</td></tr><tr><td>Total</td><td>300</td><td>293</td><td>7</td></tr></table>
<p>Por referencias: <span class="f">3/5 × 100 = 60 %</span>. Por unidades: <span class="f">(1 − 7/293) × 100 ≈ 97,61 %</span>. Ninguno es «el correcto»: el primero identifica cuántas referencias tienen discrepancia; el segundo estima la coincidencia cuantitativa. Conviene presentar ambos para que una sola cifra no esconda diferencias relevantes.</p>

<h3>5.4 Errores de preparación</h3>
<p>Ocurren cuando el pedido alistado no corresponde a los requisitos: referencia equivocada, cantidad incorrecta, omisión de productos, daño en la manipulación, etiquetado erróneo, lote o vencimiento inadecuado cuando son obligatorios, o mezcla de pedidos de clientes distintos.</p>
<p><span class="f">Tasa de errores (%) = Pedidos con uno o más errores / Total de pedidos evaluados × 100</span></p>
<p>45 pedidos con errores de 1.500: <b>3 %</b>; pedidos sin errores: 100 % − 3 % = <b>97 %</b>. Se distingue entre pedidos con errores y cantidad total de errores: un pedido con tres errores cuenta una sola vez en este indicador.</p>

<h3>5.5 Daños y devoluciones</h3>
<p><b>Tasa de daños:</b> <span class="f">Unidades dañadas / Unidades manipuladas o despachadas × 100</span> (también por pedidos afectados o por valor). Defina el denominador y el momento en que se considera ocurrido el daño.</p>
<p><b>Devoluciones logísticas:</b> no toda devolución es responsabilidad de logística (puede ser decisión comercial, característica del producto, error del cliente o cambio de preferencia). Se miden solo las de causa logística: referencia equivocada, faltante, daño en transporte.</p>
<p><span class="f">Tasa de devoluciones logísticas (%) = Pedidos devueltos por causa logística / Pedidos entregados evaluables × 100</span> · 30 de 1.200 → <b>2,5 %</b>.</p>
<details class="fq"><summary>Comprueba: un cliente devuelve producto porque cambió de opinión. ¿Entra en la tasa logística?</summary>No. Su causa es comercial o del cliente. Si se incluyera, se atribuiría a logística un resultado que no controla y se desvirtuaría el indicador.</details>

<h3>5.6 El Pedido Perfecto</h3>
<p>Es una medida integral: evalúa si una entrega cumple <b>simultáneamente</b> los requisitos definidos del servicio. Puede incluir entrega a tiempo, entrega completa, exactitud de productos y cantidades, documentación correcta, ausencia de daños y otros requisitos esenciales acordados con el cliente. Su composición debe documentarse según el modelo de servicio; si varía entre períodos o áreas, los resultados dejan de ser comparables. En su versión más exigente, un pedido solo es perfecto si cumple todos los criterios obligatorios: uno puntual pero con faltantes no lo es.</p>

<h3>5.7 Caso resuelto: calidad de 1.000 pedidos</h3>
<table class="t"><tr><th>Dimensión</th><th>Pedidos</th><th>Resultado</th></tr>
<tr><td>A tiempo</td><td>950</td><td>95 %</td></tr><tr><td>Completos</td><td>970</td><td>97 %</td></tr><tr><td>Referencias y cantidades correctas</td><td>980</td><td>98 %</td></tr><tr><td>Sin daños</td><td>960</td><td>96 %</td></tr><tr><td>Documentación correcta</td><td>990</td><td>99 %</td></tr></table>
<p>No es correcto decir que el Pedido Perfecto es 95 % porque ese sea el menor porcentaje: los incumplimientos pueden recaer en pedidos distintos. Hay que cruzar los registros y contar cuántos pedidos cumplieron todo a la vez. Si 900 lo hicieron: <span class="f">PP = 900/1.000 × 100 = 90 %</span>. Con todos los indicadores individuales entre 95 % y 99 %, el integral es 90 % porque el pedido debe cumplir las cinco condiciones al tiempo.</p>

<h3>5.8 Cómo investigar causas</h3>
<p>Medir muestra la magnitud, no el porqué. Herramientas: el <b>análisis de Pareto</b> (ordena problemas por frecuencia o impacto para priorizar) y el <b>diagrama de causa y efecto</b> (agrupa causas por categoría). Revise métodos de trabajo, personas y capacitación, equipos y tecnología, diseño del almacenamiento, identificación de productos, calidad de la información, condiciones de transporte y procedimientos de verificación. Las causas se comprueban con evidencia: no basta concluir «falta capacitación» si los registros muestran que la mayoría de errores nace de ubicaciones mal identificadas.</p>

<h3>5.9 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Consecuencia</th><th>Prevención</th></tr>
<tr><td>Medir exactitud sin definir método</td><td>Resultados no comparables</td><td>Especificar referencias, unidades o valor</td></tr>
<tr><td>Contar cada error como un pedido defectuoso</td><td>Sobrestima pedidos afectados</td><td>Diferenciar pedidos con errores y número de errores</td></tr>
<tr><td>Atribuir toda devolución a logística</td><td>Responsabilidades mal asignadas</td><td>Clasificar devoluciones por causa</td></tr>
<tr><td>Perfecto = llegó a tiempo</td><td>Se ignoran faltantes y daños</td><td>Verificar cumplimiento simultáneo</td></tr>
<tr><td>Cambiar criterios de inspección entre períodos</td><td>Distorsiona la evolución</td><td>Mantener procedimientos consistentes</td></tr></table>

<h3>5.10 Actividad de aplicación</h3>
<p>Se inspeccionan 400 referencias y 372 coinciden. En el mes se procesan 2.000 pedidos y 60 tienen al menos un error. De 1.500 pedidos entregados, 18 se devuelven por causas logísticas. Calcule exactitud por referencias, tasa de errores y tasa de devoluciones logísticas; proponga dos causas por investigar y una acción correctiva con su indicador de verificación.</p>
<details class="fq"><summary>Ver solución orientativa</summary>Exactitud: 372/400 = 93 %. Errores: 60/2.000 = 3 %. Devoluciones: 18/1.500 = 1,2 %. Causas por investigar: movimientos de inventario no registrados y errores de identificación de productos. Acción: reforzar la validación de ubicaciones y referencias en alistamiento; verificar con exactitud por referencias y tasa de errores en los períodos siguientes.</details>

<h3>5.11 Síntesis y glosario</h3>
<p>Debes poder medir la exactitud del inventario, calcular tasas de errores y devoluciones, distinguir causas logísticas de otras y comprender el carácter integral del Pedido Perfecto. Un indicador describe un resultado; la mejora exige investigar las causas y verificar los efectos de las acciones.</p>
<p><b>Conformidad:</b> cumplimiento de un requisito. <b>Pareto:</b> priorización por frecuencia o impacto. <b>Referencia (SKU):</b> código único de un producto. <b>Pedido Perfecto:</b> pedido que cumple todos los criterios definidos a la vez.</p>
<p class="ref"><b>Lectura sugerida:</b> modelo SCOR (ASCM), métrica de cumplimiento de pedido perfecto (<i>Perfect Order Fulfillment</i>); Frazelle, <i>World-Class Warehousing and Material Handling</i>, sobre exactitud de inventario y desempeño de bodegas. <b>Aclaración:</b> los dos métodos de exactitud, los criterios de Pedido Perfecto y los cálculos presentados son <b>herramientas de gestión y síntesis pedagógica</b>; la composición exacta de un Pedido Perfecto varía entre empresas y modelos. Verifica fuentes antes de citarlas.</p>`,

EXT[6]={h:`<h2>Unidad 6. Indicadores de productividad logística</h2>
<p><b>Objetivo:</b> medir la eficiencia en el uso de recursos (horas-hombre, espacio, equipos, vehículos) para maximizar resultados sin deteriorar calidad, seguridad ni condiciones de trabajo.</p>

<h3>6.1 Introducción: qué es la productividad</h3>
<p>La <b>productividad</b> es la relación entre los resultados obtenidos y los recursos empleados para producirlos. En logística evalúa qué tan bien se usan las horas de trabajo, los equipos, las instalaciones y los vehículos. No consiste en exigir que alguien trabaje más rápido: una operación puede subir los pedidos procesados y, al mismo tiempo, aumentar errores, daños, accidentes u horas extra, y el resultado global sería desfavorable. Por eso se analiza junto con calidad, tiempo, seguridad y costo.</p>
<table class="t"><tr><th>Concepto</th><th>Definición</th><th>Ejemplo (1.000 pedidos previstos)</th></tr>
<tr><td>Productividad</td><td>Resultados obtenidos por recurso empleado</td><td>Prepara 1.000 pedidos con menos horas-hombre que el estándar</td></tr>
<tr><td>Eficiencia</td><td>Uso de recursos frente a un estándar o alternativa</td><td>Consume 380 HH frente a 400 previstas</td></tr>
<tr><td>Eficacia</td><td>Grado en que se alcanzan los objetivos</td><td>Prepara 950: no logra el objetivo de volumen</td></tr></table>
<p>Se pueden alcanzar los 1.000 pedidos a tiempo (eficaz en volumen) con muchos errores (no en calidad). La evaluación completa exige mirar las tres dimensiones.</p>

<h3>6.2 Productividad de la mano de obra</h3>
<p><span class="f">Productividad laboral = Unidades de resultado / Horas-hombre empleadas</span></p>
<p>El resultado puede ser pedidos, líneas, cajas o toneladas por hora-hombre. Una <b>hora-hombre (HH)</b> es una hora de trabajo de una persona: cuatro trabajadores durante seis horas efectivas son 24 HH. Defina qué tiempo cuenta (horas efectivamente trabajadas, tiempo pagado, horas extra, actividades indirectas, esperas) y mantenga la metodología estable o documente el cambio.</p>
<p><b>Ejemplo:</b> 5 trabajadores × 6 h = 30 HH; 360 pedidos / 30 HH = <b>12 pedidos por HH</b>. Para juzgarlo hay que considerar la complejidad de los pedidos, la calidad del alistamiento, las condiciones de trabajo y el estándar operativo.</p>
<details class="fq"><summary>Comprueba: dos equipos preparan 300 pedidos; uno con 5 trabajadores y otro con 4, ambos 6 h. ¿Cuál es más productivo?</summary>El de 4: 300/24 = 12,5 pedidos/HH frente a 300/30 = 10. Antes de concluir, verifica que la complejidad de los pedidos (líneas, peso) y la calidad sean comparables.</details>

<h3>6.3 Productividad por líneas de pedido</h3>
<p>Un pedido puede tener una línea o muchas, así que contar solo pedidos distorsiona comparaciones entre equipos con pedidos de distinta complejidad. Una <b>línea</b> es una referencia solicitada en una cantidad determinada.</p>
<p><span class="f">Productividad por líneas = Líneas preparadas / Horas-hombre</span> · 1.200 líneas con 40 HH = <b>30 líneas/HH</b>.</p>
<p>Una línea de una unidad pequeña no exige el mismo esfuerzo que una línea de un pallet completo; en operaciones heterogéneas conviene segmentar o usar unidades equivalentes justificadas.</p>

<h3>6.4 Productividad y utilización de equipos</h3>
<p><span class="f">Productividad del equipo = Movimientos realizados / Horas efectivas de operación</span> · 240 movimientos en 12 h = <b>20 movimientos/h</b>. Defina qué es un movimiento válido y cómo se tratan los movimientos en vacío y las esperas. Una productividad alta no es buena si se logra con prácticas inseguras, sobrecarga del equipo o daño a la mercancía.</p>
<p><span class="f">Utilización del equipo (%) = Tiempo efectivo de utilización / Tiempo disponible definido × 100</span> · 6 h de 8 h = <b>75 %</b>. El 25 % restante no es necesariamente improductivo: puede incluir inspecciones, mantenimiento preventivo, recarga o disponibilidad para responder a la demanda. Distinga: tiempo programado, disponible, operativo, detenido por fallas, de mantenimiento, de espera por falta de trabajo y perdido por congestión o mala coordinación. Así se sabe si la baja utilización es exceso de capacidad, fallas, falta de demanda o programación deficiente.</p>

<h3>6.5 Productividad del espacio</h3>
<p><span class="f">Densidad de almacenamiento = Unidades de almacenamiento ocupadas / Superficie útil definida</span> · 800 posiciones en 1.000 m² = <b>0,8 posiciones/m²</b>. Depende de la configuración física y del método de almacenamiento. No se confunde con volumen procesado por m² ni con rotación: una bodega densa puede tener recorridos excesivos y alistamiento lento. La ocupación debe conservar espacio para circulación, seguridad, inspección, maniobra y acceso; maximizarla sin estas condiciones perjudica la operación.</p>

<h3>6.6 Productividad del transporte</h3>
<p>Indicadores posibles: toneladas por vehículo y día, entregas por ruta, kilómetros por entrega, toneladas-kilómetro por vehículo, porcentaje de capacidad utilizada. Ejemplo de utilización por peso: <span class="f">18 t / 24 t × 100 = 75 %</span>. No significa 75 % en todas las dimensiones: la carga puede agotar el volumen antes que el peso máximo, o haber restricciones de distribución de peso. La capacidad se evalúa según las restricciones reales del vehículo, la carga y la operación.</p>

<h3>6.7 Productividad y seguridad laboral</h3>
<p>Una productividad sostenible mejora resultados sin generar condiciones inseguras ni dañar la salud. Considere ergonomía de las tareas, distribución equilibrada de cargas de trabajo, disponibilidad y mantenimiento de equipos, pausas y descansos aplicables, capacitación, condiciones ambientales (el calor y la humedad de Urabá cuentan), prevención de movimientos repetitivos y sobreesfuerzos, y cumplimiento de procedimientos de seguridad. Si aumentan los pedidos por hora pero también los incidentes, los errores y las ausencias, la mejora aparente no es sostenible. La productividad no justifica ritmos incompatibles con la seguridad.</p>
<details class="fq"><summary>Comprueba: la productividad subió 12 % y las ausencias por lesiones también. ¿Se mantiene la meta?</summary>No sin revisar. La mejora puede estar apoyada en un ritmo insostenible. Hay que analizar ergonomía, cargas y pausas, y evaluar productividad, calidad y seguridad como un conjunto.</details>

<h3>6.8 Caso resuelto: dos semanas de preparación</h3>
<table class="t"><tr><th>Variable</th><th>Semana 1</th><th>Semana 2</th></tr>
<tr><td>Pedidos preparados</td><td>2.400</td><td>2.700</td></tr><tr><td>Trabajadores × horas</td><td>10 × 40</td><td>10 × 40</td></tr><tr><td>Pedidos con errores</td><td>48</td><td>81</td></tr></table>
<p>HH = 10 × 40 = 400 en ambas. Productividad: semana 1 = 2.400/400 = <b>6</b>; semana 2 = 2.700/400 = <b>6,75</b> pedidos/HH, un aumento de <span class="f">(6,75 − 6)/6 × 100 = 12,5 %</span>. Errores: semana 1 = 48/2.400 = 2 %; semana 2 = 81/2.700 = <b>3 %</b>.</p>
<p><b>Interpretación:</b> subió la productividad, pero también la tasa de errores; la mejora no es integral. La decisión no es volver al 6 por reflejo, sino investigar si los errores vienen de cambios de procedimiento, presión por cumplir objetivos, fallas de verificación, distribución del trabajo o complejidad de los pedidos, y conservar el rendimiento sin deteriorar la calidad.</p>

<h3>6.9 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Consecuencia</th><th>Prevención</th></tr>
<tr><td>Medir solo pedidos por trabajador</td><td>Se ignoran jornadas y complejidad</td><td>Usar horas-hombre y segmentar</td></tr>
<tr><td>Todo tiempo sin movimiento es improductivo</td><td>Se penalizan tareas de seguridad y mantenimiento</td><td>Clasificar los tiempos detenidos por causa</td></tr>
<tr><td>Maximizar la utilización de equipos</td><td>Se pierde capacidad de respuesta</td><td>Definir niveles adecuados de utilización</td></tr>
<tr><td>Comparar equipos distintos con el mismo estándar</td><td>Conclusiones injustificadas</td><td>Considerar capacidad, tecnología y condiciones</td></tr>
<tr><td>Aumentar velocidad sin controlar calidad</td><td>Más errores, daños y reprocesos</td><td>Evaluar productividad, calidad y seguridad juntas</td></tr>
<tr><td>Productividad como única medida individual</td><td>Se ignoran factores del proceso</td><td>Evaluar el sistema de trabajo y resultados equilibrados</td></tr></table>

<h3>6.10 Actividad de aplicación</h3>
<p>Un equipo de 6 trabajadores prepara 1.800 pedidos en una semana, con 35 horas efectivas cada uno; hay 36 pedidos con errores. Calcule HH, productividad, tasa de errores; interprete productividad y calidad juntas; proponga dos acciones que no comprometan la seguridad.</p>
<details class="fq"><summary>Ver solución orientativa</summary>HH = 6 × 35 = 210. Productividad = 1.800/210 ≈ 8,57 pedidos/HH. Errores = 36/1.800 = 2 %. Evalúe si el rendimiento y los errores son aceptables frente al estándar. Acciones: reorganizar ubicaciones según la frecuencia de alistamiento y mejorar la verificación de referencias.</details>

<h3>6.11 Síntesis y glosario</h3>
<p>Debes poder calcular productividad laboral, de equipos y de utilización, distinguir productividad, eficiencia y eficacia, reconocer las limitaciones de los promedios y proponer mejoras que no deterioren calidad, seguridad ni condiciones de trabajo.</p>
<p><b>Hora-hombre:</b> una hora de trabajo de una persona. <b>Línea de pedido:</b> referencia solicitada con cantidad. <b>Utilización:</b> tiempo efectivo sobre tiempo disponible. <b>Densidad de almacenamiento:</b> posiciones ocupadas por m². <b>Capacidad operativa:</b> capacidad realmente utilizable.</p>
<p class="ref"><b>Lectura sugerida:</b> Frazelle, <i>World-Class Warehousing and Material Handling</i>; de Koster, Le-Duc y Roodbergen (2007), «Design and control of warehouse order picking: A literature review», <i>European Journal of Operational Research</i>, sobre preparación de pedidos. <b>Aclaración:</b> las fórmulas y reglas de esta unidad son <b>herramientas de gestión y síntesis pedagógica</b>, no citas textuales; en la práctica cada empresa fija su estándar. Verifica fuentes antes de citarlas.</p>`,
