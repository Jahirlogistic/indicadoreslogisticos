EXT[7]={h:`<h2>Unidad 7. Indicadores de entrega perfecta: OTIF y excelencia logística</h2>
<p><b>Objetivo:</b> integrar tiempo y calidad en el indicador definitivo del cliente (On-Time In-Full), calcularlo correctamente y entender su impacto en la relación comercial.</p>

<h3>7.1 Introducción: qué es una entrega perfecta</h3>
<p>Es la que satisface simultáneamente los requisitos de tiempo, cantidad, exactitud, integridad física y documentación definidos para el pedido. No basta con mover la mercancía: hay que cumplir lo prometido en las condiciones acordadas. En la práctica conviven indicadores con alcances distintos, y cada empresa debe documentar el suyo; no existe una ficha técnica universal obligatoria.</p>
<table class="t"><tr><th>Indicador</th><th>Evalúa</th><th>No garantiza por sí solo</th></tr>
<tr><td>OTD</td><td>Cumplimiento del plazo</td><td>Pedido completo o sin daños</td></tr>
<tr><td>In-Full</td><td>Entrega de la totalidad requerida</td><td>Entrega a tiempo</td></tr>
<tr><td>OTIF</td><td>Plazo y completitud simultáneos</td><td>Documentación correcta o ausencia de daños, salvo que se incorporen</td></tr>
<tr><td>Pedido Perfecto</td><td>Todos los requisitos incluidos en su definición</td><td>Los criterios que la ficha técnica no incluya</td></tr></table>

<h3>7.2 Qué es OTIF y cómo se calcula</h3>
<p><b>OTIF</b> (On-Time In-Full) mide la proporción de pedidos que se entregan dentro del plazo acordado <b>y</b> con la totalidad de lo requerido según las reglas definidas. Uno puntual con faltantes no cumple; uno completo pero tardío tampoco.</p>
<p><span class="f">OTIF (%) = Pedidos entregados a tiempo y completos / Total de pedidos evaluables × 100</span></p>
<p>El numerador incluye solo pedidos que cumplen ambas condiciones; el denominador debe definirse con reglas de inclusión y exclusión documentadas.</p>
<p><b>Ejemplo:</b> 200 pedidos; 180 a tiempo, 188 completos y 174 ambas cosas. OTD = <b>90 %</b>; In-Full = <b>94 %</b>; OTIF = 174/200 = <b>87 %</b>. El OTIF es menor que ambos porque el pedido debe cumplir las dos condiciones a la vez.</p>
<details class="fq"><summary>Comprueba: ¿puede el OTIF ser mayor que el OTD?</summary>No. Los pedidos OTIF son un subconjunto de los entregados a tiempo; el OTIF nunca supera al OTD ni al In-Full.</details>

<h3>7.3 Por qué no se multiplican OTD e In-Full</h3>
<p>Multiplicar 0,90 × 0,94 da 84,6 %, pero el OTIF observado es 87 %. El producto solo equivale al resultado conjunto bajo independencia estadística entre puntualidad y completitud. En una operación real están relacionadas: la falta de inventario puede causar retrasos y faltantes a la vez, y un pedido puede retrasarse precisamente por esperar a completar unidades. <b>Regla:</b> con registros individuales, el OTIF se calcula contando directamente los pedidos que cumplieron ambas condiciones; no se estima por multiplicación sin justificar el supuesto.</p>

<h3>7.4 La unidad de medición: pedido, envío o línea</h3>
<p><b>Por pedido:</b> cumple solo si satisface el conjunto de líneas y cantidades; si de diez referencias falta una, no es completo. <b>Por envío:</b> un pedido puede dividirse en varios envíos y el resultado cambia; un pedido de 100 unidades en dos envíos de 50, uno con producto equivocado, dará resultados distintos según se mida el despacho o la obligación comercial completa. <b>Por línea:</b> identifica qué referencias generan faltantes, pero no equivale al OTIF por pedido; debe nombrarse y documentarse como líneas cumplidas. No se comparan OTIF por pedido con OTIF por envío.</p>
<p><b>Entregas parciales y cambios de fecha:</b> si el pedido exige toda la cantidad en una fecha, entregar una parte a tiempo no cumple OTIF. Se puede crear un indicador adicional de entregas parciales autorizadas, sin confundirlo con el OTIF del pedido completo. Documente los cambios de fecha solicitados por el cliente y las condiciones de una nueva promesa válida, para que el indicador no mejore artificialmente.</p>

<h3>7.5 Caso resuelto: OTIF y Pedido Perfecto en Distribuciones del Urabá</h3>
<table class="t"><tr><th>Condición (500 pedidos)</th><th>Pedidos</th><th>Indicador</th></tr>
<tr><td>A tiempo</td><td>470</td><td>OTD = 94 %</td></tr><tr><td>Completos</td><td>460</td><td>In-Full = 92 %</td></tr>
<tr><td>A tiempo y completos</td><td>440</td><td>OTIF = 88 %</td></tr>
<tr><td>OTIF + documentación correcta</td><td>425</td><td>85 %</td></tr>
<tr><td>Además sin daños</td><td>415</td><td>Pedido Perfecto = 83 %</td></tr></table>
<p>Definición usada: Pedido Perfecto = puntualidad + completitud + documentación correcta + ausencia de daños. Si se agregan criterios (exactitud de referencias, temperatura), la ficha debe actualizarse y se pierde comparabilidad histórica.</p>
<p><b>Brecha:</b> 500 − 440 = <b>60 pedidos incumplidos</b>. Se clasifican en tardíos pero completos, puntuales pero incompletos, y tardíos e incompletos. Un pedido tardío e incompleto pertenece a dos categorías, pero es un solo pedido incumplido; sumar las categorías sin cuidado duplica casos.</p>

<h3>7.6 Impacto en la relación con los clientes</h3>
<p>Un cliente que recibe completo y a tiempo planifica mejor sus inventarios y ventas; uno que recibe tarde o incompleto puede hacer compras de emergencia, reorganizar actividades y atender reclamaciones de sus propios clientes. Consecuencias posibles: más reclamaciones, costos de coordinación, reposiciones urgentes, pérdida de confianza y riesgo de perder oportunidades. Sin embargo, <b>ningún porcentaje de OTIF garantiza una tasa de retención</b>: influyen también precio, calidad del producto, competencia y relación comercial. Se analiza junto con información comercial y de satisfacción.</p>

<h3>7.7 Cómo mejorar el OTIF</h3>
<table class="t"><tr><th>Si predominan</th><th>Revisar</th></tr>
<tr><td>Retrasos</td><td>Liberación de pedidos, vehículos, programación de rutas, congestión y accesos, espera para despacho, direcciones, realismo de las promesas</td></tr>
<tr><td>Faltantes</td><td>Exactitud del inventario, disponibilidad, reposición, pronósticos, errores de preparación, asignación de inventario, sustitutos autorizados</td></tr>
<tr><td>Ambos</td><td>Una causa común: la baja disponibilidad puede detener el pedido y luego entregarlo tarde o incompleto</td></tr></table>
<p>Empiece con datos desagregados por causa, producto, ruta, cliente, centro de distribución y período, siempre que haya información suficiente para comparar válidamente.</p>

<h3>7.8 Errores frecuentes</h3>
<table class="t"><tr><th>Error</th><th>Consecuencia</th><th>Prevención</th></tr>
<tr><td>OTIF con todos los pedidos completos, aunque tardíos</td><td>Sobrestima el cumplimiento</td><td>Exigir tiempo y completitud simultáneos</td></tr>
<tr><td>Multiplicar OTD por In-Full</td><td>Estimación incorrecta</td><td>Calcular con registros individuales</td></tr>
<tr><td>Cambiar fechas prometidas después del incumplimiento</td><td>Oculta retrasos</td><td>Controlar modificaciones de compromisos</td></tr>
<tr><td>Contar cada error como un pedido distinto</td><td>Sobrestima pedidos incumplidos</td><td>Contar pedidos únicos y clasificar causas aparte</td></tr>
<tr><td>Confundir OTIF con Pedido Perfecto</td><td>Se ignoran criterios de calidad</td><td>Definir los componentes de cada indicador</td></tr>
<tr><td>Comparar OTIF por pedido con por envío</td><td>Unidades de medición distintas</td><td>Homologar alcance y denominador</td></tr></table>

<h3>7.9 Actividad de aplicación</h3>
<p>800 pedidos del mes: 760 a tiempo; 744 completos; 720 a tiempo y completos; 700 con además documentación correcta; 690 con además sin daños. Calcule OTD, In-Full, OTIF, OTIF con documentación, Pedido Perfecto (cuatro criterios) y los pedidos que incumplieron OTIF; proponga dos acciones.</p>
<details class="fq"><summary>Ver solución orientativa</summary>OTD = 95 %; In-Full = 93 %; OTIF = 90 %; OTIF con documentación = 87,5 %; Pedido Perfecto = 86,25 %; incumplieron OTIF 80 pedidos. Acciones: mejorar disponibilidad de inventario, analizar los retrasos de transporte y reforzar controles de preparación y documentación, priorizando según causas verificadas.</details>

<h3>7.10 Integración final del módulo</h3>
<p>Las siete unidades forman un solo sistema: costo, tiempo, calidad, productividad y cumplimiento se leen juntos. Una empresa puede tener costos bajos con inventarios inexactos, ciclos largos y un OTIF deficiente; otra puede lograr servicio alto usando demasiados recursos o inventario innecesario.</p>
<p><b>Caso integrador.</b> Resultados de Distribuciones del Urabá frente a metas ilustrativas:</p>
<table class="t"><tr><th>Indicador</th><th>Resultado</th><th>Meta</th><th>Brecha</th></tr>
<tr><td>CLV</td><td>11 %</td><td>≤ 10 %</td><td>+1 punto</td></tr><tr><td>Costo por pedido</td><td>$18.000</td><td>≤ $16.000</td><td>+$2.000</td></tr>
<tr><td>OTD</td><td>94 %</td><td>≥ 98 %</td><td>−4 puntos</td></tr><tr><td>Exactitud por referencias</td><td>96 %</td><td>≥ 99 %</td><td>−3 puntos</td></tr>
<tr><td>Productividad</td><td>25 ped/HH</td><td>≥ 28</td><td>−3</td></tr><tr><td>OTIF</td><td>88 %</td><td>≥ 97 %</td><td>−9 puntos</td></tr></table>
<p>Las brechas muestran dónde hay desviación, no sus causas. Pasos: (1) identificar brechas; (2) estudiar relaciones entre indicadores: ¿las diferencias de inventario generan pedidos incompletos?, ¿la baja productividad alarga la preparación?, ¿los retrasos de despacho explican el OTD? Sin evidencia no se asume una causa común; (3) priorizar: una primera línea razonable es el OTIF, porque integra tiempo y completitud, separando incumplimientos por retraso de los de faltantes y cruzándolos con inventario, productividad y tiempo; (4) formular acciones con su indicador de seguimiento (por ejemplo, mejores controles de conteo con exactitud por referencias; rediseño de ubicaciones con pedidos/HH y tasa de errores; ajuste de programación con OTD y Lead Time); (5) verificar con las mismas definiciones y reglas, documentando cualquier cambio metodológico. Una mejora se considera demostrada cuando cambia favorablemente frente a la línea base sin deterioros inaceptables en otras dimensiones.</p>
<p><b>Actividad final empresarial.</b> Elija una empresa real o simulada (con datos identificados como simulados y coherentes) y entregue: descripción de procesos; clasificación de costos logísticos; matriz con fórmulas, fuentes, metas y responsables; al menos un indicador financiero, uno de tiempo, uno de calidad y uno de productividad; OTD y OTIF si hay datos; brechas; causas diferenciando hechos comprobados de hipótesis; acciones correctivas; indicadores para verificar mejoras; conclusiones sustentadas.</p>
<table class="t"><tr><th>Criterio de evaluación sugerido</th><th>Peso</th></tr>
<tr><td>Clasificación financiera</td><td>15 %</td></tr><tr><td>Matriz y fichas técnicas</td><td>15 %</td></tr><tr><td>Exactitud de cálculos</td><td>20 %</td></tr><tr><td>Interpretación de indicadores</td><td>20 %</td></tr><tr><td>Análisis de causas y mejoras</td><td>20 %</td></tr><tr><td>Presentación y trazabilidad de datos</td><td>10 %</td></tr></table>

<h3>7.11 Síntesis y glosario</h3>
<p>Debes poder calcular e interpretar OTD, In-Full, OTIF y Pedido Perfecto, distinguir sus requisitos, definir la unidad de medición, registrar causas de incumplimiento y analizar el efecto de las mejoras sobre calidad, costos y relación con clientes.</p>
<p><b>OTIF:</b> entrega a tiempo y completa. <b>In-Full:</b> entrega de la totalidad requerida. <b>Entrega parcial:</b> parte de un pedido despachada por separado. <b>Línea base:</b> valor inicial de comparación.</p>
<p class="ref"><b>Lectura sugerida:</b> modelo SCOR (ASCM), métrica <i>Perfect Order Fulfillment</i>; Chopra y Meindl, <i>Administración de la cadena de suministro</i>. <b>Aclaración:</b> las definiciones de OTD, In-Full, OTIF y Pedido Perfecto aquí son una <b>síntesis pedagógica</b>; cada empresa y cada contrato con clientes puede definirlos distinto, y la afirmación de que el producto OTD × In-Full solo vale bajo independencia es un principio estadístico, no una cita. Verifica fuentes antes de citarlas.</p>`,
q:[
["Un pedido completo llega un día después de la fecha prometida. ¿Cumple OTIF?",["No, incumplió el requisito de tiempo","Sí, porque está completo","Sí, si la documentación es correcta","Sí, si el cliente no reclama"],0,"OTIF exige tiempo y completitud simultáneos."],
["De 200 pedidos, 174 fueron a tiempo y completos. ¿OTIF?",["87 %","90 %","94 %","174 %"],0,"174/200 × 100 = 87 %."],
["OTD 96 % e In-Full 98 %. ¿Puede afirmarse automáticamente un OTIF de 94,08 %?",["No, debe calcularse con registros individuales o justificar el supuesto","Sí, la multiplicación es obligatoria","Sí, si hay más de 100 pedidos","No, el OTIF no se expresa en porcentaje"],0,"El producto solo vale bajo independencia estadística."],
["¿Qué diferencia al Pedido Perfecto del OTIF?",["Puede incorporar criterios adicionales a puntualidad y completitud","Mide solo costo de transporte","Siempre dan el mismo resultado","No requiere definición técnica"],0,"Su alcance depende de la ficha técnica."],
["De 500 pedidos, 440 cumplen OTIF. ¿Cuántos pedidos incumplieron?",["60","440","94","12"],0,"500 − 440 = 60; un pedido tardío e incompleto cuenta una vez."],
["¿Puede el OTIF superar al OTD?",["No, es un subconjunto de los pedidos a tiempo","Sí, siempre","Solo con entregas parciales","Depende del cliente"],0,"Los pedidos OTIF son un subconjunto de los entregados a tiempo."],
["Un OTIF de 97 %, ¿garantiza la retención de clientes?",["No, influyen también precio, calidad, competencia y relación comercial","Sí, siempre","Sí, si supera 95 %","No, el OTIF no afecta al cliente"],0,"Es una variable relevante, pero no garantiza una tasa de retención."],
["Predominan los faltantes en los incumplimientos. ¿Qué conviene revisar primero?",["Exactitud del inventario, disponibilidad y políticas de reposición","Rutas y congestión vial","Solo la documentación","El precio de venta"],0,"Los faltantes apuntan a inventario, reposición y preparación."]

const U=[
{t:"Clasificación financiera",h:`<h2>Unidad 1. Clasificación de los indicadores a partir de los estados contables</h2>
<p>Un <b>indicador</b> es una medida calculada que se compara con una meta, un período anterior o un referente. Un dato aislado (gastamos $80 millones en transporte) solo describe; el indicador (8 % de las ventas) permite evaluar.</p>
<h3>Conceptos clave</h3><ul><li><b>Costo logístico:</b> recursos consumidos en transporte, almacenamiento, inventarios, preparación, devoluciones y gestión, según el alcance definido.</li><li><b>Gasto general:</b> recurso que no corresponde exclusivamente a la logística (publicidad, honorarios jurídicos corporativos).</li><li><b>Desembolso</b> (salida de dinero) e <b>inversión</b> (compra de activos) no son lo mismo que costo del período: un montacargas de $120 millones no es costo de un solo mes.</li></ul>
<h3>Clasificaciones</h3><p>Por proceso, por trazabilidad (directo/indirecto), por comportamiento (fijo, variable, mixto) y por controlabilidad. Fijo no equivale a no controlable.</p>
<h3>Procedimiento</h3><p>Definir alcance → fijar período → extraer auxiliares contables → asignar a procesos → separar directos e indirectos (con inductores como m², horas o pedidos) → evitar doble contabilización → conciliar → documentar la ficha técnica.</p>
<h3>Fórmula</h3><p><span class="f">CLV (%) = Costos logísticos / Ventas netas × 100</span></p>
<div class="ex"><b>Caso resuelto · Distribuciones del Urabá S. A. S.</b><br>Ventas $1.000 M. Logísticos: transporte 65 + personal CD 30 + bodega 15 + empaque 8 = <b>$118 M</b>. Se excluyen publicidad, honorarios y administración general.<br>CLV = 118 / 1.000 × 100 = <b>11,8 %</b>: por cada $100 vendidos hay $11,80 de costo logístico identificado. No prueba por sí solo eficiencia: falta compararlo con períodos y referentes.</div>
<p><b>Utilidad atribuible a la logística:</b> no es una partida contable normalizada; es una medida de gestión que exige definir qué ingresos y costos se atribuyen. Ejemplo: ahorro de rutas $12 M − costo adicional $3 M = beneficio neto $9 M.</p>
<h3>Errores frecuentes</h3><p>Creer que todo gasto es logístico; contar solo transporte; sumar una factura dos veces; comparar costos de un período con ventas de otro; repartir indirectos por partes iguales; asumir que menor costo siempre es mejor.</p>`,
q:[["Una factura de transporte ya incluida en el costo de adquisición se suma otra vez en el reporte logístico. ¿Cuál es el riesgo?",["Duplicar costos y sobrestimar el indicador","Subestimar las ventas netas","Reducir el tiempo de entrega","Aumentar la utilidad operacional"],0,"La doble contabilización distorsiona el indicador."],
["Ventas $750 M; transporte $42 M, bodega $18 M, empaque $6 M, publicidad $9 M. ¿Cuál es el CLV?",["8,8 %","10 %","11,2 %","14,4 %"],0,"(42+18+6)/750 = 8,8 %. La publicidad se excluye."],
["Una bodega compartida se reparte solo por ventas de cada línea. ¿Qué se debe verificar?",["Que la base refleje el consumo de recursos de cada línea","Que todas las líneas tengan el mismo precio","Que se reparta por partes iguales","Que se registre como gasto administrativo"],0,"El inductor debe guardar relación con la causa del costo."],
["El CLV baja de 12 % a 10 %. ¿Qué se concluye con solo ese dato?",["La proporción de costos sobre ventas disminuyó","La rentabilidad mejoró necesariamente","El costo absoluto bajó necesariamente","El servicio al cliente mejoró"],0,"Es una relación; el costo absoluto, la rentabilidad y el servicio requieren más información."]]},
{t:"Matriz de control",h:`<h2>Unidad 2. Matriz logística de indicadores</h2>
<p>La <b>matriz</b> organiza los KPI por proceso y los conecta con objetivos, metas, responsables, fuentes y acciones. Convierte la medición en decisiones.</p>
<h3>Lista, ficha y matriz</h3><ul><li><b>Lista:</b> qué se mide.</li><li><b>Ficha técnica:</b> cómo se calcula (fórmula, variables, unidad, fuente, periodicidad).</li><li><b>Matriz:</b> integra metas, resultado, brecha, responsable y acción correctiva.</li></ul>
<h3>Campos mínimos</h3><p>Proceso, objetivo, indicador, fórmula, unidad, meta, resultado, brecha, frecuencia, fuente, responsable y acción.</p>
<h3>Construcción</h3><p>Identificar procesos → definir objetivos → elegir indicadores → fichas técnicas → metas → responsables → frecuencia → mecanismo de reacción → validar.</p>
<div class="ex"><b>Caso resuelto</b><br>OTD real 94 % vs meta 98 %. Brecha = 94 − 98 = <b>−4 puntos porcentuales</b>. Tamaño relativo del incumplimiento = (98−94)/98 × 100 ≈ <b>4,08 %</b>. Son dos medidas distintas.</div>
<h3>Semaforización y benchmarking</h3><p>Los umbrales se definen por indicador y la lógica se invierte cuando menor es mejor (costo). Un indicador en verde con tendencia negativa justifica actuar. El <b>benchmarking</b> (interno, competitivo o funcional) solo es válido si definiciones, período, unidad y tipo de operación son comparables.</p>
<h3>Errores frecuentes</h3><p>KPI sin objetivo; cambiar fórmulas sin documentar; comparar operaciones distintas; responsables sin autoridad; usar solo indicadores de costo; semaforizar todo con la misma regla.</p>`,
q:[["¿Cuál es la diferencia entre ficha técnica y matriz de control?",["La ficha define cómo se mide; la matriz lo relaciona con metas, responsables y acciones","Son documentos idénticos","La matriz reemplaza las fórmulas","La ficha solo contiene resultados financieros"],0,"La ficha estandariza la medición; la matriz la usa para gestionar."],
["El OTD real es 94 % y la meta 98 %. ¿Cuál es la brecha?",["−4 puntos porcentuales","+4 puntos porcentuales","−6 puntos porcentuales","−94 %"],0,"94 − 98 = −4 puntos porcentuales."],
["Una empresa compara su costo por pedido con otra de operación muy distinta. ¿Qué debe hacer primero?",["Verificar comparabilidad de operaciones y definiciones","Concluir que la de menor costo es más eficiente","Igualar su meta a la del competidor","Eliminar los costos indirectos"],0,"Sin comparabilidad, el benchmarking genera brechas artificiales."],
["Un indicador prioritario muestra una desviación significativa. ¿Qué corresponde?",["Investigar la causa, asignar responsable y verificar acciones","Cambiar la fórmula","Esperar al cierre anual","Eliminar el indicador"],0,"El valor de la matriz está en convertir información en decisiones verificables."]]},
{t:"Financieros y operativos",h:`<h2>Unidad 3. Indicadores financieros y operativos</h2>
<p>Los financieros muestran cuánto cuesta operar; los operativos, cómo se ejecuta y qué se obtiene con los recursos. Se analizan juntos: reducir vehículos baja costos pero puede generar retrasos y ventas perdidas.</p>
<h3>Fórmulas</h3><ul><li><span class="f">CLV = Costos logísticos / Ventas netas × 100</span></li><li><span class="f">Costo por pedido = Costos logísticos / Pedidos incluidos</span></li><li><span class="f">Costo por tonelada = Costo de transporte / Toneladas</span></li><li><span class="f">Utilización = Capacidad utilizada / Capacidad disponible × 100</span></li><li><span class="f">Costo anual de mantener inventario = Inventario promedio × Tasa anual</span></li><li><span class="f">Demanda no atendida (%) = Valor no atendido por falta de stock / Demanda potencial definida × 100</span></li></ul>
<div class="ex"><b>Caso resuelto</b><br>Ventas $900 M; costos logísticos $99 M; 5.500 pedidos; transporte $45 M por 225 t; demanda no atendida $18 M de $450 M.<br>CLV = <b>11 %</b> · Costo por pedido = 99.000.000/5.500 = <b>$18.000</b> · Costo por tonelada = <b>$200.000</b> · Demanda no atendida = <b>4 %</b>.</div>
<p><b>Cuidados:</b> el costo por pedido es un promedio (un pedido de 1 línea no consume lo mismo que uno de 40); las ventas no concretadas no equivalen a utilidad perdida; una utilización alta puede quitar flexibilidad; el inventario se valora con base consistente (costo, no precio de venta).</p>
<h3>Errores frecuentes</h3><p>Comparar costos absolutos sin volumen; atribuir toda venta no realizada a logística; mezclar denominadores (pedidos recibidos vs entregados); tomar el 100 % de utilización como meta universal.</p>`,
q:[["Una empresa tiene $90 M de costos logísticos y procesa 6.000 pedidos. ¿Cuál es el costo por pedido?",["$15.000","$1.500","$54.000","$90.000"],0,"90.000.000 / 6.000 = $15.000."],
["Inventario promedio de $300 M y tasa anual de mantenimiento del 18 %. ¿Costo anual de mantener?",["$54 M","$18 M","$30 M","$300 M"],0,"300 × 0,18 = $54 M."],
["Se identifican $20 M de demanda no atendida por falta de stock sobre $500 M de demanda potencial. ¿Qué indicador resulta?",["4 %","20 %","2,5 %","25 %"],0,"20/500 × 100 = 4 %; no equivale a utilidad perdida."],
["Baja el costo por pedido, pero aumentan las entregas tardías. ¿Cuál es la lectura correcta?",["La reducción de costos debe evaluarse junto con el nivel de servicio","El desempeño mejoró necesariamente","El OTD dejó de ser relevante","El costo por pedido mide la rentabilidad total"],0,"Una mejora financiera aislada no garantiza mejor desempeño integral."]]},
{t:"Tiempo: Lead Time y OTD",h:`<h2>Unidad 4. Indicadores de tiempo</h2>
<p>El <b>Lead Time</b> es el tiempo entre dos eventos definidos de un proceso. Siempre debe documentarse el punto de inicio y de fin. Para el pedido al cliente: desde la recepción válida hasta la entrega.</p>
<h3>Fórmulas</h3><ul><li><span class="f">LT = Tr + Tp + Td + Tt + Te</span> (etapas consecutivas: revisión, preparación, despacho, transporte, entrega).</li><li><span class="f">LT promedio = Σ LTi / n</span>; complementar con mediana y percentil 90.</li><li><span class="f">OTD = Entregas a tiempo / Entregas evaluables × 100</span></li><li><span class="f">Cumplimiento del LT = Pedidos dentro del tiempo objetivo / Pedidos evaluables × 100</span></li></ul>
<p><b>Procesamiento vs espera:</b> muchas veces el ciclo se alarga por esperas (autorizaciones, programación), no por lentitud del trabajo. Fecha <b>prometida</b> (compromiso con el cliente) ≠ <b>programada</b> (plan interno) ≠ <b>real</b>. El OTD se mide contra la prometida.</p>
<div class="ex"><b>Caso resuelto</b><br>Validación 1 h + preparación 4 + espera de consolidación 5 + transporte 6 + entrega 2 = <b>18 h</b>. Con despachos más frecuentes la espera baja a 2 h: LT = <b>15 h</b>. Reducción = 3 h = (18−15)/18 = <b>16,67 %</b>. Antes de generalizar, verificar costo de transporte y ocupación de vehículos.</div>
<p><b>Cuello de botella:</b> etapa que restringe el flujo total; no siempre es la más larga. Se detecta por colas, utilización y pedidos detenidos.</p>
<h3>Errores frecuentes</h3><p>Medir el LT desde eventos distintos; usar solo promedios; cambiar fechas prometidas retrospectivamente; confundir OTD con OTIF; excluir pedidos tardíos sin regla.</p>`,
q:[["Un pedido tarda 2 h en validación, 4 en preparación, 3 en espera de despacho y 5 en transporte (consecutivas). ¿LT total?",["14 horas","9 horas","12 horas","15 horas"],0,"2+4+3+5 = 14 h."],
["Una empresa entrega 940 de 1.000 pedidos dentro del plazo prometido. ¿OTD?",["94 %","6 %","96 %","106 %"],0,"940/1.000 × 100 = 94 %."],
["¿Por qué el promedio del Lead Time no basta?",["Puede ocultar pedidos excepcionalmente demorados","Porque no se puede calcular","Porque siempre coincide con la mediana","Porque solo mide tiempo administrativo"],0,"Conviene analizar distribución, mediana y percentiles."],
["¿Contra qué fecha se mide el OTD?",["La fecha prometida al cliente","La fecha programada internamente","La fecha que convenga ajustar después","La fecha de facturación"],0,"La programación interna podría ocultar el incumplimiento del compromiso."]]},
{t:"Calidad logística",h:`<h2>Unidad 5. Indicadores de calidad logística</h2>
<p>La calidad es el grado en que procesos y resultados cumplen los requisitos definidos: cantidad correcta, referencia correcta, sin daños, con registros confiables y documentación adecuada.</p>
<h3>Exactitud del inventario</h3><p>Compara lo registrado con lo físico. Dos métodos que <b>no deben mezclarse</b>:</p><ul><li><span class="f">Por referencias = Referencias sin diferencias / Referencias verificadas × 100</span></li><li><span class="f">Por unidades = (1 − Σ|físico − sistema| / Σ físico) × 100</span></li></ul>
<div class="ex"><b>Caso resuelto</b><br>5 referencias, 3 coinciden: exactitud por referencias = <b>60 %</b>. Diferencias absolutas = 7 unidades sobre 293 físicas: por unidades = <b>≈ 97,61 %</b>. Cada cifra responde a una pregunta distinta; conviene reportar ambas.</div>
<h3>Otros indicadores</h3><ul><li><span class="f">Tasa de errores = Pedidos con ≥1 error / Pedidos evaluados × 100</span> (45/1.500 = 3 %; pedidos sin errores = 97 %). Se cuenta el pedido una vez, aunque tenga varios errores.</li><li><span class="f">Devoluciones logísticas = Pedidos devueltos por causa logística / Pedidos entregados × 100</span> (30/1.200 = 2,5 %). No toda devolución es culpa de logística.</li></ul>
<p><b>Pedido Perfecto:</b> cumple simultáneamente todos los criterios definidos (a tiempo, completo, exacto, sin daños, documentación correcta). Con 1.000 pedidos y 900 que cumplen todo, es <b>90 %</b>, aunque cada criterio individual esté en 95 % o más.</p>
<p><b>Causas:</b> usar Pareto y diagrama causa-efecto, y comprobar con evidencia, no con suposiciones.</p>`,
q:[["Se inspeccionan 400 referencias y 372 coinciden exactamente con el sistema. ¿Exactitud por referencias?",["93 %","7 %","96 %","97,5 %"],0,"372/400 × 100 = 93 %."],
["45 de 1.500 pedidos presentan al menos un error. ¿Tasa de errores?",["3 %","45 %","30 %","0,3 %"],0,"45/1.500 × 100 = 3 %."],
["Un pedido llega a tiempo pero con una referencia equivocada. ¿Es Pedido Perfecto?",["No, si la exactitud forma parte de los requisitos","Sí, el tiempo es lo único relevante","Sí, si el cliente no reclama","Sí, si la documentación es correcta"],0,"Debe cumplir todos los requisitos definidos a la vez."],
["30 de 1.200 pedidos entregados se devuelven por causa logística. ¿Tasa?",["2,5 %","3 %","4 %","25 %"],0,"30/1.200 × 100 = 2,5 %."]]},
{t:"Productividad",h:`<h2>Unidad 6. Indicadores de productividad logística</h2>
<p>La <b>productividad</b> relaciona resultados con recursos. <b>Eficiencia</b>: uso de recursos frente a un estándar. <b>Eficacia</b>: grado en que se alcanzan los objetivos. Se analizan con calidad, tiempo, seguridad y costo.</p>
<h3>Fórmulas</h3><ul><li><span class="f">Horas-hombre = Trabajadores × Horas efectivas</span></li><li><span class="f">Productividad laboral = Resultado / Horas-hombre</span> (pedidos, líneas, cajas o toneladas por HH)</li><li><span class="f">Productividad de equipo = Movimientos / Horas efectivas</span></li><li><span class="f">Utilización = Tiempo efectivo / Tiempo disponible × 100</span></li><li><span class="f">Utilización de vehículo = Carga transportada / Capacidad operativa × 100</span></li></ul>
<div class="ex"><b>Caso resuelto</b><br>Semana 1: 2.400 pedidos, 10 trabajadores × 40 h = 400 HH → <b>6 pedidos/HH</b>, errores 48/2.400 = 2 %.<br>Semana 2: 2.700 pedidos → <b>6,75 pedidos/HH</b> (+12,5 %), errores 81/2.700 = <b>3 %</b>.<br>La productividad subió, pero la calidad empeoró: la mejora no es integral. Se investigan causas y se busca conservar el rendimiento sin deteriorar la calidad.</div>
<p><b>Cuidados:</b> contar líneas y no solo pedidos cuando la complejidad varía; no tomar todo tiempo detenido como improductivo (mantenimiento, seguridad); una utilización del 100 % elimina capacidad de respuesta; la productividad no justifica ritmos inseguros (ergonomía, pausas, sobreesfuerzos).</p>`,
q:[["Un equipo prepara 360 pedidos con 5 trabajadores durante 6 horas efectivas. ¿Productividad?",["12 pedidos por hora-hombre","60 pedidos por hora-hombre","72 pedidos por hora-hombre","6 pedidos por hora-hombre"],0,"HH = 30; 360/30 = 12."],
["La productividad sube 15 % pero aumentan los daños. ¿Qué corresponde?",["Evaluar el desempeño conjunto y analizar causas del deterioro","Aceptar los daños como costo de la mejora","Eliminar el registro de daños","Medir solo volumen"],0,"La productividad se interpreta junto con calidad y seguridad."],
["¿Por qué una utilización del 100 % no siempre es deseable?",["Elimina capacidad para mantenimiento, variaciones de demanda y contingencias","Porque los equipos no deben usarse","Porque más del 50 % es ineficiente","Porque no puede medirse"],0,"Se requiere capacidad para continuidad y seguridad."],
["6 trabajadores, 35 horas efectivas cada uno, 1.800 pedidos. ¿Productividad aproximada?",["8,57 pedidos/HH","10 pedidos/HH","6 pedidos/HH","12,5 pedidos/HH"],0,"HH = 210; 1.800/210 ≈ 8,57."]]},
{t:"OTIF y entrega perfecta",h:`<h2>Unidad 7. Entrega perfecta: OTIF y excelencia logística</h2>
<p><b>OTIF</b> (On-Time In-Full) mide la proporción de pedidos entregados <b>a tiempo y completos</b> de forma simultánea.</p>
<ul><li><span class="f">OTD = Entregas a tiempo / Total × 100</span></li><li><span class="f">In-Full = Pedidos completos / Total × 100</span></li><li><span class="f">OTIF = Pedidos a tiempo y completos / Total × 100</span></li><li><b>Pedido Perfecto:</b> OTIF más los criterios adicionales definidos (documentación, ausencia de daños, exactitud).</li></ul>
<div class="ex"><b>Caso resuelto</b><br>200 pedidos: 180 a tiempo, 188 completos, 174 ambas cosas. OTD = <b>90 %</b>, In-Full = <b>94 %</b>, OTIF = <b>87 %</b>.<br>Multiplicar 0,90 × 0,94 daría 84,6 %, que solo es válido bajo independencia entre ambas condiciones. Con registros individuales, se cuenta directamente.</div>
<div class="ex"><b>Caso · Distribuciones del Urabá</b><br>500 pedidos: 470 a tiempo, 460 completos, 440 OTIF, 425 OTIF + documentación, 415 además sin daños. OTD 94 %, In-Full 92 %, OTIF 88 %, Pedido Perfecto <b>83 %</b>. Pedidos incumplidos OTIF = 500 − 440 = <b>60</b>; un pedido tardío e incompleto es un solo pedido incumplido.</div>
<p><b>Unidad de medición:</b> pedido, envío o línea dan resultados distintos; documéntala y no compares unidades diferentes. Las entregas parciales y cambios de fecha requieren reglas explícitas.</p>
<p><b>Impacto:</b> afecta la confiabilidad y la planificación del cliente, pero ningún porcentaje de OTIF garantiza una tasa de retención: influyen también precio, producto y competencia.</p>
<p><b>Mejora:</b> si predominan retrasos, revisar liberación, vehículos y rutas; si predominan faltantes, exactitud de inventario, reposición y preparación; si hay ambos, buscar una causa común.</p>`,
q:[["Un pedido completo llega un día después de la fecha prometida. ¿Cumple OTIF?",["No, incumplió el requisito de tiempo","Sí, porque está completo","Sí, si la documentación es correcta","Sí, si el cliente no reclama"],0,"OTIF exige tiempo y completitud simultáneos."],
["De 200 pedidos, 174 fueron a tiempo y completos. ¿OTIF?",["87 %","90 %","94 %","174 %"],0,"174/200 × 100 = 87 %."],
["OTD 96 % e In-Full 98 %. ¿Puede afirmarse automáticamente un OTIF de 94,08 %?",["No, debe calcularse con registros individuales o justificar el supuesto","Sí, la multiplicación es obligatoria","Sí, si hay más de 100 pedidos","No, el OTIF no se expresa en porcentaje"],0,"El producto solo vale bajo independencia estadística."],
["¿Qué diferencia al Pedido Perfecto del OTIF?",["Puede incorporar criterios adicionales a puntualidad y completitud","Mide únicamente costo de transporte","Siempre da el mismo resultado","No requiere definición técnica"],0,"Su alcance depende de los requisitos definidos en la ficha técnica."]]}
];

// ===== ESTADO =====
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{name:"",exits:0,events:[],u:U.map(()=>({best:null,att:[]}))};
if(!Array.isArray(S.events)) S.events=[];
if(!Array.isArray(S.u)) S.u=U.map(()=>({best:null,att:[]}));
S.u=U.map((_,i)=>S.u[i]||({best:null,att:[]}));
let cur=0,att=null,away=false;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const passed=i=>S.u[i].best!==null&&S.u[i].best>=PASS,unlocked=i=>i===0||passed(i-1);
const done=()=>S.u.filter((_,i)=>passed(i)).length;
const avg=()=>S.u.reduce((a,x)=>a+(x.best||0),0)/U.length;
const final=()=>Math.max(0,Math.min(5,avg()));
const f1=n=>n.toFixed(2).replace(".",",");

function head(){const d=done();$("hd").innerHTML=`${S.name?"👤 "+S.name+" · ":""}Progreso ${d}/7 · Incidencias registradas: <b>${S.exits}</b> · ${d===7?"Nota final: <b>"+f1(final())+"</b>":"Nota parcial: "+f1(avg())}`}
function nav(){$("nv").innerHTML=`<div class="bar" style="margin-bottom:12px"><i style="width:${done()/7*100}%"></i></div>`+
U.map((u,i)=>`<button class="u ${i===cur?"on":""}" ${unlocked(i)?"":"disabled"} onclick="go(${i})">${unlocked(i)?(passed(i)?"✅":"▶️"):"🔒"} Unidad ${i+1}<small>${u.t}${S.u[i].best!==null?" · mejor "+f1(S.u[i].best):""}</small></button>`).join("")+
`<button class="u ${cur===7?"on":""}" ${done()===7?"":"disabled"} onclick="go(7)">${done()===7?"🎓":"🔒"} Resultado final</button>`}
function go(i){cur=i;nav();view()}
function view(){head();
 if(cur===7)return finalView();
 const x=S.u[cur];
 $("mn").innerHTML=(cur===0&&!S.name?`<div class="ex"><b>Bienvenido.</b> Escribe tu nombre completo para registrar tus resultados:<br><input type="text" id="nm" placeholder="Nombre completo o código académico"> <button class="b" onclick="setName()">Guardar</button><br><small>Cada unidad se aprueba con nota ≥ ${f1(PASS)} sobre 5,0. Los cuestionarios ocultan la lectura y registran las salidas de la página.</small></div>`:"")+
 (EXT[cur+1]||U[cur]).h+`<hr><p>Intentos: ${x.att.length} · Mejor nota: ${x.best===null?"—":f1(x.best)} ${passed(cur)?'<span class="good">(aprobada)</span>':""}</p><button class="b" onclick="warn(${cur})">${passed(cur)?"Repetir evaluación":"Presentar evaluación de la unidad"}</button>`;
 scrollTo(0,0)}
function setName(){const v=$("nm").value.trim();if(v.length<3)return alert("Escribe tu nombre completo.");S.name=v;save();view()}

// ===== EVALUACIÓN =====
function warn(i){
 if(!S.name){alert("Primero registra tu nombre en la Unidad 1.");go(0);return}
 $("ov").style.display="flex";$("box").innerHTML=`<h2>⚠️ Aviso de permanencia durante la evaluación</h2>
 <p>Durante el cuestionario, la plataforma puede registrar cambios de pestaña, minimización del navegador o pérdida de foco de la ventana.</p>
 <div class="w"><ul><li>Las salidas detectadas se registran con fecha y hora como <b>incidencias para revisión docente</b>.</li><li>Al llegar a <b>${LIM} incidencias en un mismo intento</b>, el sistema mostrará un aviso. <b>No anulará automáticamente el intento ni descontará puntos.</b></li><li>Una interrupción del navegador no demuestra por sí sola una conducta indebida. El docente revisará las incidencias antes de tomar una decisión académica.</li><li>Durante el intento no tendrás acceso a la lectura.</li></ul></div>
 <p>Las respuestas correctas se mostrarán al terminar el intento. Para aprobar necesitas nota ≥ ${f1(PASS)} sobre 5,0.</p>
 <button class="b" onclick="start(${i})">Entiendo y quiero comenzar</button><button class="b g" onclick="closeOv()">Cancelar</button>`}
function closeOv(){$("ov").style.display="none";$("app").style.display="flex"}
function shuf(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1])}
function start(i){
 const qs=shuf((EXT[i+1]||U[i]).q.map(([q,o,c,e])=>({q,e,o:shuf(o.map((t,k)=>({t,ok:k===c})))})));
 att={i,qs,exits:0,done:false,t0:new Date().toISOString()};away=false;
 $("app").style.display="none";drawQuiz()}
function drawQuiz(msg){
 $("box").innerHTML=`<h2>Evaluación · Unidad ${att.i+1}</h2><p>Incidencias detectadas en este intento: <b class="${att.exits?"bad":""}">${att.exits} / ${LIM}</b></p>${msg?`<div class="w">${msg}</div>`:""}`+
 att.qs.map((q,n)=>`<div class="q"><b>${n+1}. ${q.q}</b>${q.o.map((o,k)=>`<label class="o"><input type="radio" name="q${n}" value="${k}"> ${o.t}</label>`).join("")}</div>`).join("")+
 `<button class="b" onclick="submitQ()">Enviar respuestas</button>`}
function submitQ(){
 const sel=att.qs.map((q,n)=>{const r=document.querySelector(`input[name=q${n}]:checked`);return r?+r.value:-1});
 if(sel.includes(-1))return alert("Responde todas las preguntas antes de enviar.");
 att.done=true;const ok=att.qs.filter((q,n)=>q.o[sel[n]].ok).length,score=ok/att.qs.length*5;
 record({score,ok,annulled:false});
 const pass=score>=PASS;
 $("box").innerHTML=`<h2>Resultado · Unidad ${att.i+1}</h2><p style="font-size:22px"><b class="${pass?"good":"bad"}">${f1(score)} / 5,0</b> · ${ok}/${att.qs.length} correctas · ${pass?"Unidad aprobada":"No alcanzaste la nota mínima ("+f1(PASS)+")"}</p><p>Incidencias detectadas en este intento: ${att.exits}. Quedan para revisión docente; no modifican automáticamente la nota.</p>`+
 att.qs.map((q,n)=>{const g=q.o[sel[n]].ok;return `<div class="q"><b>${n+1}. ${q.q}</b><br><span class="${g?"good":"bad"}">${g?"Correcta":"Incorrecta"}</span> · Respuesta correcta: ${q.o.find(o=>o.ok).t}<br><small>${q.e}</small></div>`}).join("")+
 `<button class="b" onclick="after(${pass})">${pass&&att.i<6?"Continuar":"Volver al curso"}</button>`}
function after(pass){const i=att.i;att=null;closeOv();if(pass&&i<6)cur=i+1;else if(pass&&done()===7)cur=7;nav();view()}
function record(r){
 const x=S.u[att.i];
 x.att.push({n:x.att.length+1,date:new Date().toISOString(),score:r.score,correct:r.ok||0,exits:att.exits,annulled:!!r.annulled,reviewRequired:att.exits>0});
 if(!r.annulled&&(x.best===null||r.score>x.best))x.best=r.score;
 save();nav();head();syncReport();
}
function exitEv(){
 if(!att||att.done||away)return;
 away=true;
 att.exits++;
 S.exits++;
 const event={
   estudiante:S.name||"Sin identificar",
   tipo:"salida_detectada",
   fecha:new Date().toISOString(),
   unidad:att.i+1,
   intento:(S.u[att.i]?.att?.length||0)+1,
   salidasEnIntento:att.exits,
   umbralAviso:LIM,
   requiereRevisionDocente:true,
   detalle:"El navegador informó pérdida de foco o cambio de visibilidad; no constituye prueba concluyente de conducta indebida."
 };
 S.events.push(event);
 save();head();syncEvent(event);
 if(att.exits>=LIM){
   drawQuizKeep(`Se han registrado ${att.exits} incidencias en este intento. El intento continúa y no se anula automáticamente. Las incidencias quedan marcadas para revisión del docente.`);
 } else {
   drawQuizKeep(`Se registró una incidencia (${att.exits}/${LIM}). Es un aviso para revisión docente; no se descuenta nota ni se anula el intento automáticamente.`);
 }
}
function drawQuizKeep(msg){
 const m=[...document.querySelectorAll("#box input:checked")].map(e=>e.name+"|"+e.value);
 drawQuiz(msg);
 m.forEach(s=>{const[n,v]=s.split("|");const e=document.querySelector(`input[name=${n}][value="${v}"]`);if(e)e.checked=true})
}
document.addEventListener("visibilitychange",()=>{document.hidden?exitEv():away=false});
addEventListener("blur",exitEv);addEventListener("focus",()=>{if(!document.hidden)away=false});

// ===== RESULTADO FINAL, INFORME Y GOOGLE SHEETS =====
function report(){return{
 tipo:"reporte",
 estudiante:S.name,
 fecha:new Date().toISOString(),
 salidas_totales:S.exits,
 incidencias:S.events,
 promedio_unidades:+avg().toFixed(2),
 nota_final:+final().toFixed(2),
 unidades:S.u.map((x,i)=>({unidad:i+1,titulo:U[i].t,mejor_nota:x.best,intentos:x.att}))
}}
function postData(payload){
 if(!SHEETS_URL)return;
 try{
   fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true});
 }catch(e){console.warn("No se pudo enviar el registro a Google Sheets.",e)}
}
function syncEvent(event){postData({tipo:"incidencia",estudiante:S.name,evento:event})}
function syncReport(){postData(report())}
function dl(){
 const r=report();
 let t=`INFORME DE EVALUACIÓN · Indicadores de gestión logística\nEstudiante: ${r.estudiante}\nFecha: ${r.fecha}\n\n`;
 r.unidades.forEach(u=>{t+=`Unidad ${u.unidad} · ${u.titulo} · mejor nota: ${u.mejor_nota===null?"—":f1(u.mejor_nota)}\n`;u.intentos.forEach(a=>t+=`   Intento ${a.n}: ${f1(a.score)} · incidencias: ${a.exits}${a.annulled?" · ANULADO":""}${a.reviewRequired?" · REVISIÓN DOCENTE":""} · ${a.date}\n`)});
 t+=`\nPromedio de unidades: ${f1(r.promedio_unidades)}\nIncidencias registradas: ${r.salidas_totales} (sin descuento automático; requieren revisión docente)\nNOTA FINAL: ${f1(r.nota_final)} / 5,0\n`;
 if(r.incidencias.length){t+="\nDETALLE DE INCIDENCIAS\n";r.incidencias.forEach(e=>t+=`${e.fecha} · Unidad ${e.unidad} · intento ${e.intento} · incidencia ${e.salidasEnIntento} · requiere revisión docente\n`)}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="informe_"+S.name.replace(/\W+/g,"_")+".txt";a.click()
}
function finalView(){head();syncReport();
 $("mn").innerHTML=`<h2>Resultado final del módulo</h2><p>Estudiante: <b>${S.name}</b></p>
 <table style="border-collapse:collapse;width:100%">${U.map((u,i)=>`<tr><td style="border:1px solid var(--b);padding:6px">Unidad ${i+1} · ${u.t}</td><td style="border:1px solid var(--b);padding:6px">${f1(S.u[i].best===null?0:S.u[i].best)}</td><td style="border:1px solid var(--b);padding:6px">${S.u[i].att.length} intento(s)</td></tr>`).join("")}</table>
 <p>Incidencias detectadas: <b>${S.exits}</b>. No generan descuento automático; quedan disponibles para revisión docente.</p>
 <p style="font-size:28px"><b>Nota final: ${f1(final())} / 5,0</b></p>
 <button class="b" onclick="dl()">Descargar informe</button>
 <button class="b g" onclick="if(confirm('Esto borra el progreso guardado en ESTE navegador. Si Google Sheets está conectado, los registros ya enviados permanecerán en la hoja. ¿Continuar?')){localStorage.removeItem(KEY);location.reload()}">Reiniciar curso en este navegador</button>`}
nav();view();
</script></body></html>
